# APK Android de test, publié sur une page GitHub (Release « android-latest »).
#
# Déclenché à chaque push sur main (et à la main : Actions > Android APK > Run workflow).
# Téléchargement direct (depuis le téléphone) :
#   https://github.com/MrCranito/maskit/releases/latest/download/RaidersGo.apk
# Page : https://github.com/MrCranito/maskit/releases/tag/android-latest
#
# APK signé avec un keystore DEBUG généré à la volée : installable pour tester (« sources
# inconnues »), pas publiable sur le Play Store. Pour une version store : keystore de release en
# secrets (voir export.yml). Le numéro de version (versionCode) suit le numéro de run, pour
# que chaque nouvel APK s'installe par-dessus le précédent.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "server/**", "art/**", "tools/prerender/**"]
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

permissions:
  contents: write

jobs:
  apk:
    name: Construire et publier l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot + modèles d'export
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Télécharger Godot et le modèle Android
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -fsSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q tpl.tpz "templates/android_*" "templates/version.txt" && rm tpl.tpz
          D=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$D" && mv templates/* "$D/" && rmdir templates
          ls -la "$D"

      - name: Réglages Android (SDK, Java, keystore debug)
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK Android : $SDK"; ls "$SDK/build-tools" | tail -3
          KS="$RUNNER_TEMP/debug.keystore"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -storepass android \
            -keystore "$KS" -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -noprompt
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KS"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.7.tres
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          # Numéro de version : un nouvel APK s'installe par-dessus l'ancien.
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg

      - name: Importer le projet
        run: ~/godot-bin/godot --headless --path . --import 2>&1 | tail -20

      - name: Exporter l'APK
        run: |
          set -o pipefail
          mkdir -p build/android
          ~/godot-bin/godot --headless --verbose --path . --export-debug "Android" build/android/RaidersGo.apk 2>&1 | tee export.log | tail -60
          ls -la build/android
          test -s build/android/RaidersGo.apk

      - name: Publier sur la page GitHub (Release android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHORT=$(git rev-parse --short HEAD)
          SIZE=$(du -h build/android/RaidersGo.apk | cut -f1)
          NOTES="APK de test RaidersGo — version 0.1.${GITHUB_RUN_NUMBER} (commit ${SHORT}), ${SIZE}.

          **Installer sur Android :** ouvre cette page sur ton téléphone, touche **RaidersGo.apk**, puis autorise l'installation depuis ton navigateur (« sources inconnues »). Les versions suivantes s'installent par-dessus.

          Lien direct : https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/RaidersGo.apk"
          gh release delete android-latest --cleanup-tag -y 2>/dev/null || true
          gh release create android-latest build/android/RaidersGo.apk \
            --target "$GITHUB_SHA" --title "RaidersGo — APK Android (dernière version)" \
            --notes "$NOTES" --latest

      - name: Journal d'export en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f export.log || echo "pas de journal" > export.log
          gh release delete android-build-log --cleanup-tag -y 2>/dev/null || true
          gh release create android-build-log export.log --target "$GITHUB_SHA" --prerelease \
            --title "Journal d'échec du build Android" --notes "Run ${GITHUB_RUN_NUMBER}"
