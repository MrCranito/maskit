# APK Android de test, publié sur une page GitHub (Release « android-latest »).
#
# Déclenché à chaque push sur main (et à la main : Actions > Android APK > Run workflow).
# Téléchargement direct (depuis le téléphone) :
#   https://github.com/MrCranito/maskit/releases/latest/download/RaidersGo.apk
# Page : https://github.com/MrCranito/maskit/releases/tag/android-latest
#
# APK signé avec un keystore DEBUG FIXE : le secret ANDROID_DEBUG_KEYSTORE_B64 s'il est défini
# (Settings > Secrets > Actions, contenu : `base64 -w 0 debug.keystore`), sinon la clé de test
# versionnée tools/android/debug.keystore (mot de passe « android »). La même clé à chaque build,
# donc chaque APK s'installe par-dessus le précédent sans perdre la sauvegarde. Installable pour tester
# (« sources inconnues »), pas publiable sur le Play Store. Pour une version store : keystore de release en
# secrets (voir export.yml). Le numéro de version (versionCode) suit le numéro de run, pour
# que chaque nouvel APK s'installe par-dessus le précédent.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "server/**", "art/**", "tools/prerender/**"]
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  IMPORT_CACHE_KEY: godot-import-4.7.2-v1

permissions:
  contents: write

jobs:
  apk:
    name: Construire et publier l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Godot + modèle Android
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: android

      - name: Cache des imports (.godot/)
        uses: actions/cache@v6
        with:
          path: .godot
          key: ${{ env.IMPORT_CACHE_KEY }}-${{ hashFiles('**/*.import', 'project.godot', 'export_presets.cfg') }}
          restore-keys: ${{ env.IMPORT_CACHE_KEY }}-

      - name: Réglages Android (SDK, Java, keystore debug)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK Android : $SDK"; ls "$SDK/build-tools" | tail -3
          # Clé de signature FIXE (sinon chaque APK a une clé différente et Android refuse de
          # l'installer par-dessus l'ancien : « Application non installée »). Ordre : secret
          # ANDROID_DEBUG_KEYSTORE_B64 (keystore en base64) s'il existe, sinon la clé de test du dépôt.
          KS="$RUNNER_TEMP/debug.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "Clé : secret ANDROID_DEBUG_KEYSTORE_B64"
          elif [ -s tools/android/debug.keystore ]; then
            cp tools/android/debug.keystore "$KS"
            echo "Clé : tools/android/debug.keystore"
          else
            echo "::error::Aucun keystore debug : définis le secret ANDROID_DEBUG_KEYSTORE_B64 ou versionne tools/android/debug.keystore."
            exit 1
          fi
          keytool -list -keystore "$KS" -storepass android | grep -i "SHA-256" || true
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KS"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.7.tres
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          # Numéro de version : un nouvel APK s'installe par-dessus l'ancien.
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.1.${GITHUB_RUN_NUMBER}\"/" export_presets.cfg

      - name: Importer le projet
        run: godot --headless --path . --import 2>&1 | tail -20

      - name: Exporter l'APK
        run: |
          set -o pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android" build/android/RaidersGo.apk 2>&1 | tee export.log | tail -60
          ls -la build/android
          test -s build/android/RaidersGo.apk

      - name: Publier sur la page GitHub (Release android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          SHORT=$(git rev-parse --short HEAD)
          SIZE=$(du -h build/android/RaidersGo.apk | cut -f1)
          NOTES="APK de test RaidersGo — version 0.1.${GITHUB_RUN_NUMBER} (commit ${SHORT}), ${SIZE}.

          **Installer sur Android :** ouvre cette page sur ton téléphone, touche **RaidersGo.apk**, puis autorise l'installation depuis ton navigateur (« sources inconnues »). Les versions suivantes s'installent par-dessus.

          Lien direct : https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/RaidersGo.apk"
          gh release delete android-latest --cleanup-tag -y 2>/dev/null || true
          gh release create android-latest build/android/RaidersGo.apk \
            --target "$GITHUB_SHA" --title "RaidersGo — APK Android (dernière version)" \
            --notes "$NOTES" --latest

      - name: Journal d'export en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-export-log
          path: export.log
          if-no-files-found: ignore
          retention-days: 14
