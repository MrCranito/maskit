<svg xmlns="http://www.w3.org/2000/svg" width="170" height="150" viewBox="0 0 170 150">
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#d9bf98"/>
      <stop offset="0.45" stop-color="#9c8572"/>
      <stop offset="1" stop-color="#4a4862"/>
    </linearGradient>
    <linearGradient id="stoneDark" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#9a8474"/>
      <stop offset="0.6" stop-color="#5e5466"/>
      <stop offset="1" stop-color="#2e2f48"/>
    </linearGradient>
    <linearGradient id="stoneLight" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f0dab2"/>
      <stop offset="0.55" stop-color="#b59a7e"/>
      <stop offset="1" stop-color="#6e6276"/>
    </linearGradient>
    <linearGradient id="shoulderR" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d2b894"/>
      <stop offset="0.55" stop-color="#8e7a70"/>
      <stop offset="1" stop-color="#47465f"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1218" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Jambes trapues -->
    <path d="M55,110 L83,113 L85,146 L50,146 L52,128 Z" fill="url(#stoneDark)"/>
    <path d="M87,113 L115,110 L118,128 L120,146 L85,146 Z" fill="url(#stoneDark)"/>
    <!-- Bras gauche (cote lumiere), rocheux -->
    <path d="M22,64 L40,58 L56,64 L54,86 L50,104 L28,108 L20,88 Z" fill="url(#stone)"/>
    <!-- Bras droit (cote ombre) -->
    <path d="M148,64 L130,58 L114,64 L116,86 L120,104 L142,108 L150,88 Z" fill="url(#stoneDark)"/>
    <!-- Torse rocheux -->
    <path d="M48,54 L66,38 L104,38 L122,54 L128,92 L116,122 L85,128 L54,122 L42,92 Z" fill="url(#stone)"/>
    <!-- Plaques pectorales -->
    <path d="M54,62 L72,56 L84,60 L84,84 L70,92 L58,86 Z" fill="url(#stoneLight)" stroke-width="1.8"/>
    <path d="M86,60 L98,56 L116,62 L112,86 L100,92 L86,84 Z" fill="url(#shoulderR)" stroke-width="1.8"/>
    <!-- Ventre en blocs -->
    <path d="M62,94 L84,88 L84,120 L66,118 Z" fill="url(#stone)" stroke-width="1.8"/>
    <path d="M86,88 L108,94 L104,118 L86,120 Z" fill="url(#stoneDark)" stroke-width="1.8"/>
    <!-- Poings massifs irreguliers -->
    <path d="M10,108 L22,98 L42,100 L52,114 L48,134 L34,144 L16,142 L6,126 Z" fill="url(#stone)"/>
    <path d="M160,108 L148,98 L128,100 L118,114 L122,134 L136,144 L154,142 L164,126 Z" fill="url(#stoneDark)"/>
    <path d="M14,118 L26,114 L32,122 M22,132 L34,128 L40,134 M156,118 L144,114 L138,122 M148,132 L136,128 L130,134" fill="none" stroke-width="1.6"/>
    <!-- Epaules enormes (blocs) -->
    <path d="M10,64 L12,42 L28,26 L54,24 L70,38 L68,58 L48,72 L22,74 Z" fill="url(#stoneLight)"/>
    <path d="M160,64 L158,42 L142,26 L116,24 L100,38 L102,58 L122,72 L148,74 Z" fill="url(#shoulderR)"/>
    <!-- Facettes des epaules -->
    <path d="M12,46 L30,48 L44,40 L54,24 M30,48 L34,70" fill="none" stroke-width="1.5"/>
    <path d="M158,46 L140,48 L126,40 L116,24 M140,48 L136,70" fill="none" stroke-width="1.5"/>
    <!-- Eclats rocheux sur les epaules -->
    <path d="M26,30 L30,14 L40,26 Z" fill="url(#stoneLight)" stroke-width="1.8"/>
    <path d="M42,26 L52,10 L58,26 Z" fill="url(#stoneLight)" stroke-width="1.8"/>
    <path d="M144,30 L140,14 L130,26 Z" fill="url(#shoulderR)" stroke-width="1.8"/>
    <path d="M128,26 L118,10 L112,26 Z" fill="url(#shoulderR)" stroke-width="1.8"/>
    <!-- Tete enfoncee, penchee en avant -->
    <path d="M66,46 L72,32 L98,32 L104,46 L100,62 L85,70 L70,62 Z" fill="url(#stone)"/>
    <!-- Arcade sourciliere lourde -->
    <path d="M66,46 L85,42 L104,46 L102,52 L85,50 L68,52 Z" fill="url(#stoneLight)" stroke-width="1.8"/>
    <!-- Orbites (les yeux lumineux sont dessines en code) -->
    <path d="M72,52 L83,52 L82,58 L74,58 Z" fill="#1e141c" stroke-width="1.4"/>
    <path d="M98,52 L87,52 L88,58 L96,58 Z" fill="#1e141c" stroke-width="1.4"/>
    <ellipse cx="78.5" cy="55" rx="2.6" ry="1.7" fill="#f2e8da" stroke="none"/>
    <ellipse cx="91.5" cy="55" rx="2.6" ry="1.7" fill="#f2e8da" stroke="none"/>
    <path d="M77,63 L81,61 L85,64 L89,61 L93,63" fill="none" stroke-width="1.6"/>
  </g>
  <!-- Ombres bleu nuit sous les masses -->
  <g fill="#1c2244" opacity="0.35">
    <path d="M22,74 L48,72 L56,64 L54,86 L28,84 Z"/>
    <path d="M148,74 L122,72 L114,64 L116,86 L142,84 Z"/>
    <path d="M54,122 L85,128 L116,122 L118,128 L85,134 L52,128 Z"/>
  </g>
  <!-- Fissures sombres -->
  <g fill="none" stroke="#1d141a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72,96 L78,104 L73,114"/>
    <path d="M100,64 L96,72 L102,80"/>
    <path d="M24,36 L36,46 L32,58"/>
    <path d="M136,84 L130,94"/>
    <path d="M20,120 L28,134"/>
    <path d="M78,34 L82,40"/>
  </g>
  <!-- Lueur discrete dans les fissures -->
  <g fill="none" stroke="#ffa04a" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M72,96 L78,104 L73,114"/>
    <path d="M100,64 L96,72 L102,80"/>
    <path d="M24,36 L36,46 L32,58"/>
  </g>
  <!-- Reflets chauds du haut -->
  <g fill="none" stroke="#fbe8c4" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M14,44 L28,30 L50,28"/>
    <path d="M58,62 L72,58"/>
    <path d="M73,35 L97,35"/>
    <path d="M12,108 L22,100 L38,102"/>
    <path d="M68,42 L102,42" opacity="0.5"/>
  </g>
  <!-- Mousse / lichen ocre discret -->
  <g fill="#8a8a52" stroke="#1a1218" stroke-width="1" opacity="0.85">
    <path d="M118,30 L126,28 L124,33 Z"/>
    <path d="M44,104 L50,102 L48,108 Z"/>
  </g>
</svg>
