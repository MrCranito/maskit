<svg xmlns="http://www.w3.org/2000/svg" width="130" height="136" viewBox="0 0 130 136">
  <defs>
    <linearGradient id="armor" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5e6280"/>
      <stop offset="0.5" stop-color="#33364c"/>
      <stop offset="1" stop-color="#171926"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#8a8ea6"/>
      <stop offset="1" stop-color="#363a52"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a2a40"/>
      <stop offset="1" stop-color="#2a0f1e"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fbf5ea"/>
      <stop offset="0.6" stop-color="#d6ccbe"/>
      <stop offset="1" stop-color="#958ca0"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8dcc4"/>
      <stop offset="1" stop-color="#7c6c62"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0f4"/>
      <stop offset="1" stop-color="#6d7289"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6a44"/>
      <stop offset="1" stop-color="#4a2e22"/>
    </linearGradient>
  </defs>
  <g stroke="#14111b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Manche de hache posee sur l'epaule -->
    <path d="M78,112 L114,22 L119,24 L84,114 Z" fill="url(#wood)"/>
    <!-- Fer de hache -->
    <path d="M108,20 Q122,6 128,10 Q124,30 128,46 Q118,44 106,36 Z" fill="url(#steel)"/>
    <path d="M112,24 Q120,16 124,16" fill="none" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Jambes epaisses -->
    <path d="M40,104 L62,104 L62,126 L38,126 Z" fill="url(#armor)"/>
    <path d="M68,104 L90,104 L94,126 L68,126 Z" fill="url(#armor)"/>
    <path d="M34,132 L36,122 L63,122 L63,132 Z" fill="#2a2230"/>
    <path d="M67,132 L67,122 L94,122 L97,132 Z" fill="#231d2a"/>
    <!-- Bras gauche massif -->
    <path d="M17,60 L37,62 L35,96 L15,94 Z" fill="url(#armor)"/>
    <path d="M12,94 L32,92 L34,106 L14,108 Z" fill="url(#plate)"/>
    <!-- Torse en tonneau -->
    <path d="M28,56 Q65,40 102,56 L106,96 Q98,114 65,115 Q32,114 24,96 Z" fill="url(#armor)"/>
    <path d="M44,60 L86,60 L84,86 Q65,94 46,86 Z" fill="url(#plate)" stroke-width="1.8"/>
    <path d="M65,62 L65,88" fill="none" stroke-width="1.5"/>
    <!-- Pagne -->
    <path d="M52,102 L78,102 L76,126 L65,122 L54,126 Z" fill="url(#cloth)"/>
    <!-- Ceinture et boucle d'os -->
    <path d="M28,94 L102,94 L101,103 L29,103 Z" fill="#5a3e2e" stroke-width="1.8"/>
    <path d="M58,92 L72,92 L72,105 L58,105 Z" fill="url(#bone)" stroke-width="1.6"/>
    <circle cx="65" cy="98.5" r="2.2" fill="#2a2030" stroke="none"/>
    <!-- Bras droit levé tenant le manche -->
    <path d="M93,60 L108,56 L111,82 L98,86 Z" fill="url(#armor)"/>
    <circle cx="102" cy="76" r="7" fill="url(#plate)"/>
    <!-- Epaulieres a pointes -->
    <path d="M18,52 L12,40 L26,46 Z" fill="url(#plate)" stroke-width="1.8"/>
    <path d="M112,52 L118,40 L104,46 Z" fill="url(#plate)" stroke-width="1.8"/>
    <path d="M10,64 Q10,46 28,44 Q44,46 46,58 Q36,70 10,64 Z" fill="url(#plate)"/>
    <path d="M120,64 Q120,46 102,44 Q86,46 84,58 Q94,70 120,64 Z" fill="url(#plate)"/>
    <!-- Cornes -->
    <path d="M54,32 Q38,30 32,10 Q42,18 58,24 Z" fill="url(#horn)"/>
    <path d="M76,32 Q92,30 98,10 Q88,18 72,24 Z" fill="url(#horn)"/>
    <!-- Casque -->
    <path d="M49,44 Q49,22 65,20 Q81,22 81,44 Q77,56 65,58 Q53,56 49,44 Z" fill="url(#armor)"/>
    <!-- Masque cornu en os -->
    <path d="M51,31 Q65,22 79,31 L78,46 Q72,57 65,57 Q58,57 52,46 Z" fill="url(#bone)"/>
    <path d="M53,35 L62,38 L61,42 L54,40 Z" fill="#1c141e" stroke-width="1.2"/>
    <path d="M77,35 L68,38 L69,42 L76,40 Z" fill="#1c141e" stroke-width="1.2"/>
    <path d="M56,39 L60,39.6" fill="none" stroke="#f2ece4" stroke-width="1.6"/>
    <path d="M74,39 L70,39.6" fill="none" stroke="#f2ece4" stroke-width="1.6"/>
    <!-- Crocs -->
    <path d="M57,48 L60,53 L62,48.5 L65,54 L68,48.5 L70,53 L73,48 Z" fill="#2a2030" stroke-width="1.2"/>
  </g>
  <g fill="none" stroke="#3a2a3a" stroke-width="1.2" stroke-linecap="round">
    <path d="M65,24 L65,33"/>
    <path d="M58,30 L61,33 M72,30 L69,33"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.6">
    <path d="M16,52 Q22,46 30,46"/>
    <path d="M48,63 L70,63"/>
    <path d="M54,28 Q60,24 66,24"/>
  </g>
</svg>
