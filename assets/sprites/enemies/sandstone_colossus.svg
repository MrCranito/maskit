<svg xmlns="http://www.w3.org/2000/svg" width="180" height="160" viewBox="0 0 180 160">
  <!-- Colosse de gres rouge : strates ocre/rouge, cactus et os incrustes, fissures lumineuses orange, masque-crane de buffle. -->
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#f0a86a"/>
      <stop offset="0.45" stop-color="#b8583a"/>
      <stop offset="1" stop-color="#4a2a44"/>
    </linearGradient>
    <linearGradient id="rockDark" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#b4603e"/>
      <stop offset="0.6" stop-color="#7a3632"/>
      <stop offset="1" stop-color="#2e2040"/>
    </linearGradient>
    <linearGradient id="rockLight" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd09a"/>
      <stop offset="0.55" stop-color="#d27a4a"/>
      <stop offset="1" stop-color="#7a3a3c"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fbf5ea"/>
      <stop offset="0.6" stop-color="#ddd0bc"/>
      <stop offset="1" stop-color="#9a8c96"/>
    </linearGradient>
    <linearGradient id="cactus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ab25a"/>
      <stop offset="1" stop-color="#3e5a36"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1218" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Jambes trapues -->
    <path d="M58,118 L88,121 L90,156 L52,156 L55,136 Z" fill="url(#rockDark)"/>
    <path d="M92,121 L122,118 L125,136 L128,156 L90,156 Z" fill="url(#rockDark)"/>
    <!-- Bras gauche -->
    <path d="M24,68 L42,62 L58,68 L56,92 L52,112 L30,116 L22,94 Z" fill="url(#rock)"/>
    <!-- Bras droit (ombre) -->
    <path d="M156,68 L138,62 L122,68 L124,92 L128,112 L150,116 L158,94 Z" fill="url(#rockDark)"/>
    <!-- Torse -->
    <path d="M50,58 L70,42 L110,42 L130,58 L136,98 L124,130 L90,136 L56,130 L44,98 Z" fill="url(#rock)"/>
    <!-- Strates horizontales du gres -->
    <path d="M46,82 Q90,90 134,80" fill="none" stroke="#7a3632" stroke-width="2"/>
    <path d="M45,100 Q90,108 136,98" fill="none" stroke="#7a3632" stroke-width="2"/>
    <path d="M52,118 Q90,126 128,116" fill="none" stroke="#7a3632" stroke-width="2"/>
    <path d="M47,90 Q90,98 134,88" fill="none" stroke="#e8a46a" stroke-width="1.2"/>
    <path d="M48,109 Q90,117 132,107" fill="none" stroke="#e8a46a" stroke-width="1.2"/>
    <!-- Cote ombre du torse -->
    <path d="M90,42 L110,42 L130,58 L136,98 L124,130 L90,136 Z" fill="#3a1e3c" opacity="0.28" stroke="none"/>
    <!-- Plaques pectorales -->
    <path d="M58,64 L76,58 L88,62 L88,84 L74,90 L62,86 Z" fill="url(#rockLight)" stroke-width="1.8"/>
    <path d="M92,62 L104,58 L122,64 L118,86 L106,90 L92,84 Z" fill="url(#rock)" stroke-width="1.8"/>
    <!-- Cage thoracique d'os incrustee -->
    <g fill="url(#bone)" stroke-width="1.4">
      <path d="M68,96 Q76,92 86,96 L86,99 Q76,96 68,100 Z"/>
      <path d="M70,104 Q78,100 86,104 L86,107 Q78,104 70,108 Z"/>
      <path d="M94,96 Q104,92 112,96 L112,100 Q104,96 94,99 Z"/>
      <path d="M94,104 Q102,100 110,104 L110,108 Q102,104 94,107 Z"/>
      <path d="M87,92 L93,92 L92,114 L88,114 Z"/>
    </g>
    <!-- Poings massifs -->
    <path d="M10,116 L24,104 L46,106 L56,122 L52,144 L36,154 L16,152 L6,134 Z" fill="url(#rock)"/>
    <path d="M170,116 L156,104 L134,106 L124,122 L128,144 L144,154 L164,152 L174,134 Z" fill="url(#rockDark)"/>
    <path d="M8,128 Q30,134 54,128 M6,140 Q28,146 52,140" fill="none" stroke="#7a3632" stroke-width="1.8"/>
    <path d="M172,128 Q150,134 126,128 M174,140 Q152,146 128,140" fill="none" stroke="#5a2430" stroke-width="1.8"/>
    <!-- Epaules en blocs stratifies -->
    <path d="M10,68 L12,44 L30,28 L58,26 L74,40 L72,62 L50,76 L22,78 Z" fill="url(#rockLight)"/>
    <path d="M170,68 L168,44 L150,28 L122,26 L106,40 L108,62 L130,76 L158,78 Z" fill="url(#rock)"/>
    <path d="M12,52 Q40,58 72,48 M14,64 Q40,70 70,58" fill="none" stroke="#a04a36" stroke-width="1.8"/>
    <path d="M168,52 Q140,58 108,48 M166,64 Q140,70 110,58" fill="none" stroke="#7a3632" stroke-width="1.8"/>
    <!-- Cactus pousses sur l'epaule gauche -->
    <path d="M36,32 L36,10 Q36,4 41,4 Q46,4 46,10 L46,32 Z" fill="url(#cactus)"/>
    <path d="M36,22 L29,22 Q26,22 26,18 L26,12 Q26,8 29.5,8 Q33,8 33,12 L33,16 L36,16 Z" fill="url(#cactus)" stroke-width="1.8"/>
    <path d="M46,18 L51,18 L51,13 Q51,10 54,10 Q57,10 57,13 L57,20 Q57,24 53,24 L46,24 Z" fill="url(#cactus)" stroke-width="1.8"/>
    <circle cx="41" cy="4.5" r="2.6" fill="#e86a8a" stroke-width="1.2"/>
    <!-- Corne/os plante dans l'epaule droite -->
    <path d="M132,30 Q140,10 156,4 Q148,16 142,32 Z" fill="url(#bone)" stroke-width="1.8"/>
    <path d="M118,28 L124,12 L130,28 Z" fill="url(#rock)" stroke-width="1.8"/>
    <!-- Tete enfoncee -->
    <path d="M70,50 L76,34 L104,34 L110,50 L106,68 L90,76 L74,68 Z" fill="url(#rockDark)"/>
    <!-- Masque-crane de buffle (os) -->
    <path d="M72,46 L90,40 L108,46 L104,62 L96,74 L90,76 L84,74 L76,62 Z" fill="url(#bone)"/>
    <!-- Cornes du crane -->
    <path d="M74,44 Q58,44 52,30 Q62,36 76,38 Z" fill="url(#bone)" stroke-width="1.8"/>
    <path d="M106,44 Q122,44 128,30 Q118,36 104,38 Z" fill="url(#bone)" stroke-width="1.8"/>
    <!-- Orbites (yeux lumineux dessines en code) -->
    <path d="M76,51 L87,52 L86,59 L78,58 Z" fill="#1e141c" stroke-width="1.4"/>
    <path d="M104,51 L93,52 L94,59 L102,58 Z" fill="#1e141c" stroke-width="1.4"/>
    <ellipse cx="82" cy="55.5" rx="2.6" ry="1.7" fill="#f2e8da" stroke="none"/>
    <ellipse cx="98" cy="55.5" rx="2.6" ry="1.7" fill="#f2e8da" stroke="none"/>
    <path d="M87,64 L90,70 L93,64" fill="#1e141c" stroke-width="1.2"/>
  </g>
  <!-- Ombres bleu nuit -->
  <g fill="#1c2244" opacity="0.35">
    <path d="M22,78 L50,76 L58,68 L56,92 L30,90 Z"/>
    <path d="M158,78 L130,76 L122,68 L124,92 L150,90 Z"/>
    <path d="M56,130 L90,136 L124,130 L126,136 L90,142 L54,136 Z"/>
  </g>
  <!-- Fissures sombres -->
  <g fill="none" stroke="#1d141a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60,90 L66,100 L60,112 L66,124"/>
    <path d="M118,66 L112,76 L120,86 L114,96"/>
    <path d="M26,40 L40,50 L34,64"/>
    <path d="M142,90 L136,102"/>
    <path d="M22,126 L30,140"/>
    <path d="M152,124 L146,138"/>
    <path d="M98,36 L94,44"/>
  </g>
  <!-- Fissures lumineuses orange -->
  <g fill="none" stroke="#ffb04a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60,90 L66,100 L60,112 L66,124"/>
    <path d="M118,66 L112,76 L120,86 L114,96"/>
    <path d="M26,40 L40,50 L34,64"/>
    <path d="M22,126 L30,140"/>
    <path d="M152,124 L146,138"/>
  </g>
  <g fill="none" stroke="#ff7a2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.28">
    <path d="M60,90 L66,100 L60,112 L66,124"/>
    <path d="M118,66 L112,76 L120,86 L114,96"/>
  </g>
  <!-- Marques rouges sur le crane -->
  <g fill="none" stroke="#b2262a" stroke-width="1.6" stroke-linecap="round">
    <path d="M90,42 L90,50"/>
    <path d="M80,62 L84,66 M100,62 L96,66"/>
  </g>
  <!-- Reflets chauds -->
  <g fill="none" stroke="#ffe6c0" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M14,48 L30,32 L54,30"/>
    <path d="M62,64 L76,60"/>
    <path d="M76,46 L90,42"/>
    <path d="M12,116 L24,108 L42,110"/>
    <path d="M39,8 L39,28" stroke="#d8e6a0"/>
  </g>
</svg>
