<svg xmlns="http://www.w3.org/2000/svg" width="130" height="136" viewBox="0 0 130 136">
  <!-- Brute masquee au fusil a canon scie : poncho raye, masque cornu en os, cartouchieres croisees. -->
  <defs>
    <linearGradient id="poncho" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#c26a3a"/>
      <stop offset="0.5" stop-color="#8a3a26"/>
      <stop offset="1" stop-color="#3e1820"/>
    </linearGradient>
    <linearGradient id="ponchoDark" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#8a4430"/>
      <stop offset="0.6" stop-color="#5a2422"/>
      <stop offset="1" stop-color="#2a1020"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fbf5ea"/>
      <stop offset="0.6" stop-color="#d6ccbe"/>
      <stop offset="1" stop-color="#958ca0"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8dcc4"/>
      <stop offset="1" stop-color="#6c5c52"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a62"/>
      <stop offset="1" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#8a6450"/>
      <stop offset="1" stop-color="#3e2a2c"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8dce6"/>
      <stop offset="0.5" stop-color="#7a7e92"/>
      <stop offset="1" stop-color="#2e3044"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8703e"/>
      <stop offset="1" stop-color="#4a2a1c"/>
    </linearGradient>
  </defs>
  <g stroke="#14111b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- Jambes epaisses -->
    <path d="M40,104 L62,104 L62,124 L38,124 Z" fill="url(#pants)"/>
    <path d="M68,104 L90,104 L94,124 L68,124 Z" fill="url(#pants)"/>
    <!-- Bottes + eperons -->
    <path d="M33,132 L35,120 L63,120 L63,132 Z" fill="#4a2c1e"/>
    <path d="M67,132 L67,120 L95,120 L98,132 Z" fill="#3a2218"/>
    <path d="M34,128 L27,128 M97,128 L104,128" fill="none" stroke-width="1.8"/>
    <circle cx="24" cy="128" r="3.6" fill="#d8c08a" stroke-width="1.4"/>
    <circle cx="107" cy="128" r="3.6" fill="#b89a64" stroke-width="1.4"/>
    <!-- Bras gauche nu, massif -->
    <path d="M14,62 L32,64 L32,96 L14,94 Z" fill="url(#skin)"/>
    <path d="M12,92 L30,90 L32,104 L14,106 Z" fill="#5a3a2c"/>
    <!-- Poncho (masse principale, trapeze) -->
    <path d="M30,50 Q65,38 100,50 L112,104 Q90,114 65,112 Q40,114 18,104 Z" fill="url(#poncho)"/>
    <!-- Bandes du poncho -->
    <path d="M23,84 Q65,96 107,84 L109,92 Q65,104 21,92 Z" fill="#e2c07a" stroke-width="1.6"/>
    <path d="M22,90 Q65,101 108,90" fill="none" stroke="#7a1c26" stroke-width="2.4"/>
    <path d="M18,104 Q40,114 65,112 Q90,114 112,104 L110,98 Q90,108 65,106 Q40,108 20,98 Z" fill="#3e1820" stroke-width="1.6"/>
    <!-- Franges -->
    <path d="M24,106 L22,112 M32,109 L31,115 M40,111 L40,117 M90,111 L90,117 M98,109 L99,115 M106,106 L108,112" fill="none" stroke-width="1.6"/>
    <!-- Cote ombre du poncho -->
    <path d="M65,46 Q84,44 100,50 L112,104 Q96,112 78,112 Q80,80 65,46 Z" fill="url(#ponchoDark)" opacity="0.55" stroke="none"/>
    <!-- Cartouchieres croisees -->
    <path d="M36,52 L42,48 L92,92 L86,96 Z" fill="#4a3020" stroke-width="1.6"/>
    <path d="M94,52 L88,48 L38,92 L44,96 Z" fill="#3c2618" stroke-width="1.6"/>
    <g fill="#e8a83e" stroke-width="1">
      <rect x="47" y="56" width="3.4" height="6" transform="rotate(-48 48.7 59)"/>
      <rect x="55" y="63" width="3.4" height="6" transform="rotate(-48 56.7 66)"/>
      <rect x="71" y="77" width="3.4" height="6" transform="rotate(-48 72.7 80)"/>
      <rect x="79" y="56" width="3.4" height="6" transform="rotate(48 80.7 59)"/>
      <rect x="71" y="63" width="3.4" height="6" transform="rotate(48 72.7 66)"/>
      <rect x="55" y="77" width="3.4" height="6" transform="rotate(48 56.7 80)"/>
    </g>
    <!-- Fusil a canon scie, tenu des deux mains en travers -->
    <path d="M30,92 L44,86 L50,96 L36,104 Z" fill="url(#wood)"/>
    <path d="M44,84 L118,70 L120,80 L48,96 Z" fill="url(#barrel)"/>
    <path d="M46,90 L119,75" fill="none" stroke-width="1.4"/>
    <ellipse cx="119" cy="75" rx="3" ry="5.6" fill="#2e3044" stroke-width="1.6"/>
    <circle cx="118.6" cy="72.6" r="1.3" fill="#0c0a10" stroke="none"/>
    <circle cx="119.4" cy="77.6" r="1.3" fill="#0c0a10" stroke="none"/>
    <path d="M58,86 L64,84 L70,98 L64,100 Z" fill="url(#wood)" stroke-width="1.8"/>
    <!-- Mains -->
    <circle cx="44" cy="94" r="7" fill="url(#skin)"/>
    <circle cx="90" cy="82" r="7" fill="url(#skin)"/>
    <!-- Bras droit (vers la main avant) -->
    <path d="M98,58 L112,62 L96,88 L84,82 Z" fill="url(#skin)"/>
    <!-- Epaules sous le poncho -->
    <path d="M12,66 Q12,48 30,46 Q44,48 46,58 Q36,70 12,66 Z" fill="url(#poncho)"/>
    <path d="M118,64 Q118,46 100,44 Q86,46 84,56 Q94,68 118,64 Z" fill="url(#ponchoDark)"/>
    <!-- Cornes -->
    <path d="M52,30 Q34,30 26,8 Q38,16 56,22 Z" fill="url(#horn)"/>
    <path d="M78,30 Q96,30 104,8 Q92,16 74,22 Z" fill="url(#horn)"/>
    <!-- Capuche / tete -->
    <path d="M47,42 Q47,20 65,18 Q83,20 83,42 Q79,56 65,58 Q51,56 47,42 Z" fill="#2a1e26"/>
    <!-- Masque cornu en os (crane de buffle) -->
    <path d="M50,28 Q65,20 80,28 L78,44 Q72,56 65,58 Q58,56 52,44 Z" fill="url(#bone)"/>
    <!-- Fentes des yeux (lueur dessinee en code) -->
    <path d="M53,33 L62,36 L61,40.5 L54,38.5 Z" fill="#1c141e" stroke-width="1.2"/>
    <path d="M77,33 L68,36 L69,40.5 L76,38.5 Z" fill="#1c141e" stroke-width="1.2"/>
    <!-- Narines de crane -->
    <path d="M62,46 L64,50 L61,50 Z M68,46 L66,50 L69,50 Z" fill="#1c141e" stroke-width="1"/>
    <!-- Crocs -->
    <path d="M57,51 L60,56 L62,52 L65,57 L68,52 L70,56 L73,51 Z" fill="#2a2030" stroke-width="1.2"/>
    <!-- Chapeau de feutre perce par les cornes -->
    <path d="M52,22 Q52,10 65,9 Q78,10 78,22 Z" fill="#3a2a2a"/>
    <path d="M36,24 Q44,18 65,20 Q86,18 94,24 Q86,28 65,26 Q44,28 36,24 Z" fill="#4a3430"/>
  </g>
  <!-- Marques rouges du masque -->
  <g fill="none" stroke="#b2262a" stroke-width="1.6" stroke-linecap="round">
    <path d="M65,28 L65,36"/>
    <path d="M55,42 L58,46 M75,42 L72,46"/>
  </g>
  <g fill="none" stroke="#3a2a3a" stroke-width="1.2" stroke-linecap="round">
    <path d="M58,29 L60,32 M72,29 L70,32"/>
  </g>
  <g fill="none" stroke="#f2ece4" stroke-width="1.6" stroke-linecap="round">
    <path d="M56,37.2 L60,37.8"/>
    <path d="M74,37.2 L70,37.8"/>
  </g>
  <!-- Reflets -->
  <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.6">
    <path d="M52,27 Q58,23 64,23"/>
    <path d="M52,85 L114,72"/>
    <path d="M30,30 Q34,20 38,17"/>
  </g>
  <g fill="none" stroke="#ffd29a" stroke-width="1.3" stroke-linecap="round" opacity="0.7">
    <path d="M16,52 Q22,47 30,47"/>
    <path d="M34,52 Q50,44 64,43"/>
    <path d="M16,64 L16,92"/>
  </g>
</svg>
