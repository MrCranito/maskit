; L'extraction ne donne plus d'or (seulement des gemmes, [shop]).
; Vente d'un objet : or = round(value de l'ItemData × sell_ratio), au moins sell_min.
; Repère : une partie extraite moyenne (~500 de valeur) ≈ 250 or ≈ une arme Commune (220-280 or).
sell_ratio=0.5
sell_min=1
; Vente d'une arme en double (on garde toujours un exemplaire), par rareté 0 Commun … 4 Légendaire
weapon_sell_by_rarity=[40, 90, 150, 350, 800]
; Confirmation demandée avant de vendre un objet de rareté ≥ (2 = Rare)
confirm_min_rarity=2
; Or d'un profil neuf (les anciens « dollars » sauvegardés deviennent de l'or)
starting_gold=0
; Animation du compteur d'or (s) et durée du message « Nouvelle arme déblocable » en raid (s)
gold_anim_time=0.6
unlock_notice_duration=4.5
; Écrans Marchand / Atelier : côté d'une case d'objet (px), largeur du panneau de détail (px)
tile_size=92.0
detail_width=360.0

[crafting]
; Atelier (scenes/ui/menus/crafting.tscn, data/recipes/*.tres). Groupes d'ingrédients « @nom » :
; n'importe quel objet de la liste convient (les moins chers sont consommés en premier).
group_mechanism=["mat_gears", "space_circuit", "mall_batteries"]
group_scrap=["mat_scrap"]
; Coût en or de chaque fabrication = gold_cost de la recette (data/recipes) × gold_cost_mult,
; arrondi, au moins min_gold_cost. Repère : un raid moyen ≈ 250 or à la vente.
gold_cost_mult=1.0
min_gold_cost=5
; Consommables de soin de la réserve ajoutés au sac de raid au lancement (unités max) ;
; « Emporter mes soins » activé par défaut (réglable sur l'écran d'arsenal de départ)
raid_consumables_max=4
pack_consumables_default=true
; Leurre (scripts/economy/decoy_device.gd, noise_sources.gd) : niveau de bruit (≈ 1 = tir du joueur),
; rayon par défaut (px, l'arme fournit effect_radius), intervalle d'attraction (s), seuil d'audition,
; hausse de jauge par passage (× bruit entendu), marge sous le seuil d'alerte (jamais d'alerte au leurre)
decoy_level=1.0
decoy_radius=520.0
decoy_tick=0.25
decoy_hearing_floor=0.05
decoy_gain=0.15
decoy_alert_margin=0.08
; Rendu : intervalle des bips (s), période et rayon des ondes (px)
decoy_beep_interval=0.6
decoy_ring_period=1.2
decoy_ring_radius=46.0
; Échelle du boîtier posé au sol
decoy_body_scale=1.6

[net]
; Coop en ligne (agent Coop, scripts/net/*, serveur relais server/ — voir server/README.md).
; URL du relais en développement (serveur lancé sur la machine : cd server && npm start)
url_dev="ws://127.0.0.1:8787"
; URL du relais en production (WSS obligatoire sur iPhone) : Worker Cloudflare déployé par
; .github/workflows/relay-cloudflare.yml (santé : https://raidersgo-relay.victor-roux-vr.workers.dev/health)
url_prod="wss://raidersgo-relay.victor-roux-vr.workers.dev"
; true = utiliser url_prod même dans l'éditeur (tout export, debug compris, l'utilise si renseignée)
use_prod=false
; Délai max de connexion (s), ping (s), silence du serveur avant coupure (s)
connect_timeout=6.0
ping_interval=2.0
silence_timeout=8.0
; Reconnexion automatique après une coupure : fenêtre totale et intervalle entre essais (s)
reconnect_window=20.0
reconnect_interval=1.5
; Envois par seconde : état du joueur, instantanés des ennemis (hôte)
state_rate=20.0
enemy_rate=15.0
; Interpolation des entités distantes : retard (s) et extrapolation max (s)
interp_delay=0.1
extrapolate_max=0.15
; Rayon (px) autour du coéquipier dans lequel l'hôte synchronise ennemis et tirs ennemis
enemy_sync_radius=1800.0
; Difficulté à 2 joueurs : PV des ennemis multipliés
coop_enemy_hp_mult=1.6
; À terre : durée avant la mort (s) ; réanimation : durée à maintenir (s), portée (px), PV rendus (ratio)
downed_time=15.0
revive_time=3.0
revive_range=90.0
revive_hp_ratio=0.35
; Changement d'étage commun : compte à rebours (s)
floor_countdown=3.0
; Verrou de fouille libéré quand on s'éloigne du conteneur (px)
lock_release_distance=160.0
