; Flanquement : angle (degrés) autour du joueur pour les alliés de côté
flank_angle_deg=75.0
; Échange de tirs : pas de déplacement latéral (px) ; probabilité qu'un tireur embusqué reste immobile
strafe_step=110.0
sniper_hold_chance=0.45
; Patrouille : nombre de points d'intérêt, rayon = patrol_radius × ce facteur
patrol_points=4
patrol_radius_mult=1.6
; Recherche du joueur perdu : points fouillés, rayon (px), durée max (s), regard (s), vitesse, jauge gardée
search_points=3
search_radius=180.0
search_time=9.0
search_look_time=1.2
search_speed_ratio=0.75
search_awareness=0.75
; Repli à faible vie : durée (s), distance (px)
retreat_time=2.2
retreat_distance=300.0
; Tir précis : fraction finale du télégraphe où la visée est figée (fenêtre d'esquive)
aim_lock_ratio=0.25
; Dynamite : anticipation du déplacement du joueur (0..1), dégâts aux autres ennemis (fraction),
; dégâts minimum au bord du cercle (fraction)
lob_lead=0.5
dynamite_friendly_fire=0.5
dynamite_min_frac=0.3
; Recul (px/s) de la brute quand elle tire au fusil
shotgun_recoil_push=110.0
; Cris : délai mini (s) entre deux cris d'un même ennemi
shout_cooldown=2.5
; Recul d'un ennemi touché (balles, plombs, explosions) : × EnemyData.knockback. 0 = aucun recul
hit_knockback_mult=0.0

[enemy_difficulty]
; Multiplicateurs des ennemis selon la difficulté de la carte (index 0 Facile … 4 Cauchemar).
; Les PV et la vitesse de base restent ceux de data/enemies (les cartes les modifient via MapCard).
; (Retour testeur n°4 : plus difficile — PV +25 % et alerte -30 % dans data/enemies, cadence et
; précision meilleures dès Normal ; les télégraphes gardent leur durée pour rester esquivables.)
damage_mult=[0.75, 1.0, 1.12, 1.25, 1.4]
windup_mult=[1.2, 1.0, 0.95, 0.9, 0.85]
cooldown_mult=[1.15, 0.9, 0.84, 0.78, 0.7]
spread_mult=[1.3, 0.85, 0.75, 0.65, 0.55]
speed_mult=[0.94, 1.0, 1.04, 1.07, 1.1]
; Temps de recharge des compétences (scripts/enemies/skills)
skill_cooldown_mult=[1.3, 1.0, 0.92, 0.85, 0.75]

[enemy_variants]
; Variantes d'apparition (scripts/enemies/enemy_variants.gd), en attendant que le roster du monde
; les liste : kind du générateur → {kind: poids} (tirage déterministe par case d'apparition).
outlaw_knife={"outlaw_knife": 5.0, "dynamiter": 1.6}
gunslinger={"gunslinger": 4.0, "rifleman": 2.2}
; Élites et boss unique : placés à la génération du raid (BestiaryRules, section [boss]).

[enemy_loot]
; Cadavres et butin des ennemis (scripts/loot/loot_manager.gd, enemy_corpse.gd, ground_loot.gd)
corpses_enabled=true
corpse_loot=true
; Nombre max de cadavres par étage (les plus anciens déjà fouillés disparaissent d'abord)
max_corpses_per_floor=30
; Durée de fouille d'un cadavre (s) ; lueur de rareté visible avant la fouille
corpse_search_time=0.9
corpse_glow_before_search=false
; Butin qui tombe au sol à la mort : chance par défaut (EnemyData.ground_drop_chance la remplace),
; nombre max d'objets, table, bonus d'objets de l'élite, multiplicateur de chance de clef de l'élite
ground_drop_chance=0.35
ground_drop_max=2
ground_table="enemy_drop"
elite_extra_ground=2
elite_key_mult=4.0
; Rayon (px) de ramassage en marchant dessus
ground_pickup_radius=22.0

[battle_pass]
; Pass de combat (agent Pass & skins, scripts/progression/battle_pass.gd). Saison en cours :
season_path="res://data/battle_pass/season_01.tres"
; Prix de la piste premium (gemmes)
premium_price=950
; XP de fin de raid : extraction réussie (base + valeur extraite × facteur) ou mort (base)
xp_extraction=250
xp_per_value=0.08
xp_death=60
; + kills (× facteur en cas de mort) + minutes survécues (plafonnées, × facteur en cas de mort)
xp_per_kill=12
xp_per_minute=15
xp_max_minutes=20
xp_death_factor=0.5
; Plafond d'XP par raid
xp_raid_max=1500

[economy]
; Économie (agent Économie, scripts/economy/*, Profile.gold) : l'or (pièces) se gagne en VENDANT au
; marchand (scenes/ui/menus/merchant.tscn) et sert à acheter des armes à l'armurerie (écran Arsenal).
; L'extraction ne donne plus d'or (seulement des gemmes, [shop]).
; Vente d'un objet : or = round(value de l'ItemData × sell_ratio), au moins sell_min.
; Repère : une partie extraite moyenne (~500 de valeur) ≈ 250 or ≈ une arme Commune (220-280 or).
sell_ratio=0.5
sell_min=1
; Vente d'une arme en double (on garde toujours un exemplaire), par rareté 0 Commun … 4 Légendaire
weapon_sell_by_rarity=[40, 90, 150, 350, 800]
; Confirmation demandée avant de vendre un objet de rareté ≥ (2 = Rare)
confirm_min_rarity=2
; Or d'un profil neuf (les anciens « dollars » sauvegardés deviennent de l'or)
starting_gold=0
; Animation du compteur d'or (s) et durée du message « Nouvelle arme déblocable » en raid (s)
gold_anim_time=0.6
unlock_notice_duration=4.5
; Écrans Marchand / Atelier : côté d'une case d'objet (px), largeur du panneau de détail (px)
tile_size=92.0
detail_width=360.0

[crafting]
; Atelier (scenes/ui/menus/crafting.tscn, data/recipes/*.tres). Groupes d'ingrédients « @nom » :
; n'importe quel objet de la liste convient (les moins chers sont consommés en premier).
group_mechanism=["mat_gears", "space_circuit", "mall_batteries"]
group_scrap=["mat_scrap"]
; Coût en or de chaque fabrication = gold_cost de la recette (data/recipes) × gold_cost_mult,
; arrondi, au moins min_gold_cost. Repère : un raid moyen ≈ 250 or à la vente.
gold_cost_mult=1.0
min_gold_cost=5
; Consommables de soin de la réserve ajoutés au sac de raid au lancement (unités max) ;
; « Emporter mes soins » activé par défaut (réglable sur l'écran d'arsenal de départ)
raid_consumables_max=4
pack_consumables_default=true
; Leurre (scripts/economy/decoy_device.gd, noise_sources.gd) : niveau de bruit (≈ 1 = tir du joueur),
; rayon par défaut (px, l'arme fournit effect_radius), intervalle d'attraction (s), seuil d'audition,
; hausse de jauge par passage (× bruit entendu), marge sous le seuil d'alerte (jamais d'alerte au leurre)
decoy_level=1.0
decoy_radius=520.0
decoy_tick=0.25
decoy_hearing_floor=0.05
decoy_gain=0.15
decoy_alert_margin=0.08
; Rendu : intervalle des bips (s), période et rayon des ondes (px)
decoy_beep_interval=0.6
decoy_ring_period=1.2
decoy_ring_radius=46.0
; Échelle du boîtier posé au sol
decoy_body_scale=1.6

[net]
; Coop en ligne (agent Coop, scripts/net/*, serveur relais server/ — voir server/README.md).
; URL du relais en développement (serveur lancé sur la machine : cd server && npm start)
url_dev="ws://127.0.0.1:8787"
; URL du relais en production (WSS obligatoire sur iPhone), ex. "wss://raidersgo-relay.fly.dev"
url_prod=""
; true = utiliser url_prod même dans l'éditeur (les exports de production l'utilisent toujours si renseignée)
use_prod=false
; Délai max de connexion (s), ping (s), silence du serveur avant coupure (s)
connect_timeout=6.0
ping_interval=2.0
silence_timeout=8.0
; Reconnexion automatique après une coupure : fenêtre totale et intervalle entre essais (s)
reconnect_window=20.0
reconnect_interval=1.5
; Envois par seconde : état du joueur, instantanés des ennemis (hôte)
state_rate=20.0
enemy_rate=15.0
; Interpolation des entités distantes : retard (s) et extrapolation max (s)
interp_delay=0.1
extrapolate_max=0.15
; Rayon (px) autour du coéquipier dans lequel l'hôte synchronise ennemis et tirs ennemis
enemy_sync_radius=1800.0
; Difficulté à 2 joueurs : PV des ennemis multipliés
coop_enemy_hp_mult=1.6
; À terre : durée avant la mort (s) ; réanimation : durée à maintenir (s), portée (px), PV rendus (ratio)
downed_time=15.0
revive_time=3.0
revive_range=90.0
revive_hp_ratio=0.35
; Changement d'étage commun : compte à rebours (s)
floor_countdown=3.0
; Verrou de fouille libéré quand on s'éloigne du conteneur (px)
lock_release_distance=160.0
; Position verticale (px) de la carte du coéquipier dans le HUD (sous la barre de vie)
hud_card_top=74.0

[enemy_skills]
; Compétences des ennemis (scripts/enemies/enemy_skill.gd, enemy_skills.gd, skills/*) ; les valeurs
; propres à chaque compétence sont dans data/enemies/<kind>.tres (champ skills).
; Intervalle (s) entre deux recherches de compétence en combat, contrôle des compétences
; réactives (roulade quand on le vise), délai minimal (s) entre deux compétences d'un ennemi
check_interval=0.3
reactive_check_interval=0.12
skill_gap=1.2

[player_status]
; Statuts infligés au joueur (scripts/player/player_status.gd) : durée max (s), angle max (°)
; de visée perturbée quand aveuglé, opacité du flash, poussée (px/s) du renversement
max_duration=3.0
blind_aim_jitter_deg=14.0
blind_flash_alpha=0.85
knockdown_push=420.0

[boss]
; Boss du monde (scripts/enemies/enemy.gd « Boss : phases », scripts/ui/boss_bar.gd, populators)
; Invulnérabilité pendant la transition de phase (s), si la phase ne la précise pas.
phase_invuln=1.2
; Un seul boss par raid : étage où il apparaît ("deepest" = étage le plus dangereux du raid).
one_per_raid=true
; Élites du monde (WorldData.elite_kinds) : gardes des salles au trésor, escorte du boss,
; et chance qu'un ennemi d'une salle de combat devienne élite (par étage : 0, 1, 2…).
elite_super_loot_guards=1
elite_boss_escorts=2
elite_combat_chance=[0.0, 0.04, 0.08]
; Barre de boss (HUD) : largeur (px), délai du bandeau de phase (s).
bar_width=560.0
phase_banner_time=2.2

[bestiary_space_station]
; Bestiaire de la Station spatiale (agent Station). Rangée 2 de la planche (plus durs) : poids
; du roster multipliés par étage — rares sur le pont principal (0), fréquents aux ponts profonds.
row2_kinds=["ss_detector", "ss_station_guardian", "ss_alien"]
row2_floor_mult={"-1": 1.6, "0": 0.6, "1": 1.3}

[bestiary_far_west]
; Bestiaire du Far West (agent Far West) : compétences scripts/enemies/skills/far_west/*. Valeurs
; par défaut des compétences ; chaque data/enemies/fw_*.tres peut les remplacer (champ skills).
; Rangée 2 de la planche (Maraudeur, Robuste, Chien de garde) : poids du roster multipliés par
; étage (populator.gd) — moins nombreux au rez-de-chaussée, fréquents au sous-sol et à l'étage.
row2_kinds=["fw_marauder", "fw_bruiser", "fw_guard_dog"]
row2_floor_mult={"-1": 1.6, "0": 0.7, "1": 1.3}
; Chien de garde : aboiement d'alarme (recharge s, délai s, télégraphe s, rayon d'alerte px,
; rayon où un joueur caché est débusqué px)
alarm_bark_cooldown=9.0
alarm_bark_initial_cooldown=0.2
alarm_bark_windup=0.35
alarm_bark_radius=760.0
alarm_bark_reveal_radius=140.0
; Maraudeur : chasse en meute (rayon px, bonus de dégâts et de vitesse par congénère, congénères
; comptés au plus, intervalle de recalcul s)
pack_hunter_radius=300.0
pack_hunter_damage_per_ally=0.15
pack_hunter_speed_per_ally=0.06
pack_hunter_max_allies=3.0
pack_hunter_interval=0.5
; Maraudeur : hurlement (recharge, délai, télégraphe, rayon d'appel de la meute, rayon de « meute
; proche », taille minimale avant renfort, renforts par hurlement, renforts vivants au plus)
pack_howl_cooldown=26.0
pack_howl_initial_cooldown=1.5
pack_howl_windup=0.7
pack_howl_radius=900.0
pack_howl_pack_radius=320.0
pack_howl_min_pack=2.0
pack_howl_count=1.0
pack_howl_max_total=2.0
; Robuste : garde du corps (recharge, délai, télégraphe, rayon de recherche d'un allié, distance
; à l'allié, gain de position minimal px, temps de course max s, vitesse ×, tenue du bouclier s)
bodyguard_cooldown=7.0
bodyguard_initial_cooldown=2.0
bodyguard_windup=0.25
bodyguard_ally_radius=340.0
bodyguard_stand_offset=70.0
bodyguard_min_gain=40.0
bodyguard_move_time=2.2
bodyguard_speed_mult=1.25
bodyguard_hold=2.4
