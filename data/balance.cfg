damage=14.0
fire_rate=3.0
projectile_speed=980.0
range=620.0
projectile_lifetime=0.65
projectile_count=1
spread_degrees=0.0
pierce=0

[projectile_pool]
; Projectiles pré-instanciés par pool (le pool s'agrandit si épuisé)
