chase_sight_multiplier=1.5
; Distance (px) considérée comme « arrivé »
arrive_distance=12.0
; Évitement des murs en steering direct : longueur (px, en plus du rayon) et angle des moustaches
whisker_length=48.0
whisker_angle_deg=35.0
; NavigationAgent2D : recalcul du chemin si la cible a bougé de plus de (px)
nav_repath_distance=24.0
; Patrouille : vitesse (fraction de move_speed), pauses aléatoires (s), abandon d'une destination (s)
patrol_speed_ratio=0.4
patrol_pause_min=0.8
patrol_pause_max=2.2
patrol_walk_timeout=3.0
; Poursuite : mémoire de la position réelle juste après perte de vue (s), recherche max (s), laisse (px)
track_memory=0.5
search_timeout=4.0
leash_distance=900.0
; L'archer recule à cette fraction de sa vitesse
retreat_speed_ratio=0.8
; Attaque : récupération après le coup (s), tolérance de portée mêlée au moment de l'impact (px)
attack_recovery=0.25
melee_hit_tolerance=16.0
; Retour : vitesse (fraction), régénération (fraction des PV max par seconde), abandon (s)
return_speed_ratio=0.7
return_regen_ratio_per_sec=0.25
return_timeout=8.0
; Libération du corps si le visuel n'émet jamais death_finished (s)
death_free_fallback=2.0
; Projectiles ennemis : taille du pool, durée de vie (s)
projectile_pool_size=24
projectile_lifetime=2.5
; Largeur de la barre de vie (px)
health_bar_width=56.0
; --- Discrétion : jauge de reconnaissance (awareness 0..1) ---
; Palier de suspicion (s'arrête, se tourne, « ? », enquête)
suspicion_threshold=0.3
; Vue : multiplicateur du gain au bord du rayon de détection / tout près (courbe (1-d/r)^2 entre les deux)
sight_edge_mult=0.1
sight_near_mult=2.0
; Vue : joueur immobile = gain x ce facteur (interpolé jusqu'à 1 à pleine vitesse)
sight_still_mult=0.45
; Vitesse de référence du joueur (px/s) s'il n'expose pas move_speed
player_speed_default=250.0
; Ouïe : atténuation à travers les murs (pas de ligne de vue), bruit ignoré en dessous de ce seuil
hearing_wall_factor=0.4
hearing_noise_floor=0.05
; Ouïe : un saut de bruit >= shot_noise_jump (tir) ajoute un sursaut immédiat
; shot_awareness_bump x (1 - d/hearing_radius) x (shot_wall_factor sans ligne de vue)
shot_noise_jump=0.5
shot_awareness_bump=0.9
shot_wall_factor=0.7
; Repli si le joueur n'a pas get_noise_level() : bruit de marche, décroissance du bruit de tir (s)
fallback_walk_noise=0.35
fallback_shot_noise_decay=0.6
; Voisin prévenu : hausse de jauge (pas un 1 instantané, sauf s'il voit le joueur)
neighbor_awareness_boost=0.6
; Jauge conservée quand la poursuite abandonne (re-repérage plus rapide)
lost_awareness=0.6
; Enquête : pause de suspicion (s), vitesse (fraction), abandon de la marche (s), regard autour (s), changement de regard (s), durée max (s)
suspicion_pause=0.7
investigate_speed_ratio=0.55
investigate_walk_timeout=6.0
investigate_look_time=2.4
investigate_look_turn=0.6
investigate_timeout=12.0
; Joueur vu en train de se cacher : distance max (px), mémoire (s), fouille de la cachette (s)
hide_reveal_distance=220.0
hide_seen_memory=0.6
hide_search_time=0.6
; Sommeil des ennemis loin du joueur (px ; ~1,5 écran) : endormi au-delà de sleep_distance, réveillé sous wake_distance, vérif (s)
sleep_distance=1800.0
wake_distance=1600.0
sleep_check_interval=0.5
; Navigation : recalcul de chemin au plus toutes les (s), revérification de la carte (s)
nav_repath_interval=0.25
nav_check_interval=1.0

