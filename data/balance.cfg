; Valeurs d'équilibrage. Aucune de ces valeurs ne doit être écrite en dur dans le code.
; Lire via l'autoload Balance : Balance.get_value("section", "cle", defaut)

[player]
max_hp=100.0
move_speed=250.0
; Déplacement : accélération / décélération linéaires minimales (px/s²) + approche
; exponentielle (accel_sharpness, 1/s) : réactif au départ, arrêt net sans glisse.
acceleration=2400.0
deceleration=3200.0
accel_sharpness=18.0
; Multiplicateur d'accélération quand on change de sens (contre-braquage)
turn_boost=1.8
; Ancienne friction (remplacée par deceleration), gardée pour compatibilité
friction=3200.0
; OBSOLÈTE : plus de tir automatique (double stick). Gardé pour les anciens tests.
auto_fire_only_when_still=false
; Invulnérabilité (s) après un coup reçu, durée du flash blanc (s)
invulnerability_duration=0.6
hit_flash_duration=0.12
; OBSOLÈTE (ancien ciblage automatique)
retarget_interval=0.1
; Bruit (0..1) : marche à pleine vitesse ; durée (s) de décroissance du bruit de tir (1 → 0)
noise_walk=0.35
noise_fire_decay=0.6
; Cachette : on ressort en poussant le stick gauche au-delà de ce seuil, après ce délai (s)
hide_exit_threshold=0.5
hide_exit_grace=0.3
; Opacité du héros caché
hidden_alpha=0.35
; Aide à la visée au stick (mobile) : demi-angle du cône (°), 0 = désactivée
aim_assist_deg=12.0
; Dispersion des tirs (WeaponData.spread_bloom_* / spread_move_deg, WeaponLoadout) : multiplicateurs
; globaux du « bloom » (rafale) et de l'imprécision en mouvement, délai (s) après le dernier tir
; avant que la dispersion redescende, cône affiché = imprécision × mult (plafonné, °)
spread_bloom_mult=1.0
spread_move_mult=1.0
spread_recovery_delay=0.08
spread_cone_visual_mult=1.6
spread_cone_visual_max=28.0

[player_visual]
; Repli SVG : rebond (px), inclinaison (°), écrasement à l'appui, longueur de foulée (px)
bounce_px=3.0
tilt_deg=5.0
squash=0.06
stride_px=34.0
; Hystérésis (°) du choix de direction 8 voies (anti-scintillement)
dir_hysteresis_deg=7.0
; Main (pivot de l'arme) : hauteur au-dessus des pieds et écart latéral (px monde)
hand_height=22.6
hand_radius=10.0
; Recul de l'arme (px, s) et durée de l'éclair de bouche (s)
recoil_px=5.0
recoil_time=0.09
muzzle_flash_time=0.05
; Poussière de pas (CPUParticles2D) : activée, nombre de particules
dust_enabled=true
dust_amount=8

[camera]
smoothing_speed=7.0
; Zoom paysage (1280x720) : champ de vision ≈ 985 x 555 px monde (héros et ennemis plus lisibles sur téléphone)
zoom=1.3
; Anticipation dans la direction de visée (px monde) et vitesse de rattrapage (1/s)
lookahead=110.0
lookahead_speed=4.0
; Légère secousse au tir
