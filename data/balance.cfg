; Valeurs d'équilibrage. Aucune de ces valeurs ne doit être écrite en dur dans le code.
; Lire via l'autoload Balance : Balance.get_value("section", "cle", defaut)

[player]
max_hp=100.0
move_speed=250.0
; Déplacement : accélération / décélération linéaires minimales (px/s²) + approche
; exponentielle (accel_sharpness, 1/s) : réactif au départ, arrêt net sans glisse.
acceleration=2400.0
deceleration=3200.0
accel_sharpness=18.0
; Multiplicateur d'accélération quand on change de sens (contre-braquage)
turn_boost=1.8
; Ancienne friction (remplacée par deceleration), gardée pour compatibilité
friction=3200.0
; OBSOLÈTE : plus de tir automatique (double stick). Gardé pour les anciens tests.
auto_fire_only_when_still=false
; Invulnérabilité (s) après un coup reçu, durée du flash blanc (s)
invulnerability_duration=0.6
hit_flash_duration=0.12
; OBSOLÈTE (ancien ciblage automatique)
retarget_interval=0.1
; Bruit (0..1) : marche à pleine vitesse ; durée (s) de décroissance du bruit de tir (1 → 0)
noise_walk=0.35
noise_fire_decay=0.6
; Cachette : on ressort en poussant le stick gauche au-delà de ce seuil, après ce délai (s)
hide_exit_threshold=0.5
hide_exit_grace=0.3
; Opacité du héros caché
hidden_alpha=0.35

[player_visual]
; Repli SVG : rebond (px), inclinaison (°), écrasement à l'appui, longueur de foulée (px)
bounce_px=3.0
tilt_deg=5.0
squash=0.06
stride_px=34.0
; Hystérésis (°) du choix de direction 8 voies (anti-scintillement)
dir_hysteresis_deg=7.0
; Main (pivot de l'arme) : hauteur au-dessus des pieds et écart latéral (px monde)
hand_height=24.0
hand_radius=10.0
; Recul de l'arme (px, s) et durée de l'éclair de bouche (s)
recoil_px=5.0
recoil_time=0.09
muzzle_flash_time=0.05
; Poussière de pas (CPUParticles2D) : activée, nombre de particules
dust_enabled=true
dust_amount=8

[camera]
smoothing_speed=7.0
; Zoom paysage (1280x720) : champ de vision ≈ 1160 x 655 px monde
zoom=1.1
; Anticipation dans la direction de visée (px monde) et vitesse de rattrapage (1/s)
lookahead=110.0
lookahead_speed=4.0
; Légère secousse au tir
shake_on_fire=true
shake_amount=2.5
shake_duration=0.09

[hud]
; Paysage 1280x720 : marge des panneaux (px), largeur de la barre de vie (px)
margin=16
hp_bar_width=300
; Bandeau monde/salle (haut centre) : marge haute (px)
banner_top=12
; Overlay debug F3 : position (px) sous la barre de vie, taille de police
debug_overlay_top=96
debug_overlay_font_size=15

[weapon_default]
; Arme de départ : revolver (data/weapons/starter_revolver.tres)
damage=14.0
fire_rate=3.0
projectile_speed=980.0
range=620.0
projectile_lifetime=0.65
projectile_count=1
spread_degrees=0.0
pierce=0

[projectile_pool]
; Projectiles pré-instanciés par pool (le pool s'agrandit si épuisé)
size=64

[target_dummy]
max_hp=60.0
respawn_delay=2.0

[joystick]
; Rayon de la base (px écran, viewport 1280x720)
radius=90.0
; Zone morte du stick gauche (déplacement) et du stick droit (visée : en deçà, pas de tir)
dead_zone=0.15
aim_dead_zone=0.3
; Affiche les joysticks même sans écran tactile (test sur PC)
force_on_desktop=false
; Aucun stick ne s'active au-dessus de cette fraction de la hauteur d'écran (HUD)
activation_top_ratio=0.25
; Position de repos (fraction de l'écran) des bases fantômes gauche / droite
left_rest_x=0.13
right_rest_x=0.87
rest_y=0.77
show_rest_ghost=true
; La base suit le doigt s'il dépasse le rayon
follow_finger=true


[test_room]
; Dimensions de la salle de test (px)
width=1400.0
height=2000.0
wall_thickness=64.0
tile_size=80.0
; Délai (s) avant rechargement de la salle après la mort du joueur
reload_delay=2.0
; Rayon d'agent (px) pour cuire la navigation (marge autour des piliers)
nav_agent_radius=30.0

[debug]
; Intervalle de rafraîchissement du texte de l'overlay F3 (s)
overlay_refresh_interval=0.2

[enemy_ai]
; Intervalle (s) entre deux tests de perception (zone + cône + raycast de ligne de vue)
los_check_interval=0.1
; En combat, portée de vue = detection_radius x ce facteur (cône ignoré)
chase_sight_multiplier=1.5
; Distance (px) considérée comme « arrivé »
arrive_distance=12.0
; Évitement des murs en steering direct : longueur (px, en plus du rayon) et angle des moustaches
whisker_length=48.0
whisker_angle_deg=35.0
; NavigationAgent2D : recalcul du chemin si la cible a bougé de plus de (px)
nav_repath_distance=24.0
; Patrouille : vitesse (fraction de move_speed), pauses aléatoires (s), abandon d'une destination (s)
patrol_speed_ratio=0.4
patrol_pause_min=0.8
patrol_pause_max=2.2
patrol_walk_timeout=3.0
; Poursuite : mémoire de la position réelle juste après perte de vue (s), recherche max (s), laisse (px)
track_memory=0.5
search_timeout=4.0
leash_distance=900.0
; L'archer recule à cette fraction de sa vitesse
retreat_speed_ratio=0.8
; Attaque : récupération après le coup (s), tolérance de portée mêlée au moment de l'impact (px)
attack_recovery=0.25
melee_hit_tolerance=16.0
; Retour : vitesse (fraction), régénération (fraction des PV max par seconde), abandon (s)
return_speed_ratio=0.7
return_regen_ratio_per_sec=0.25
return_timeout=8.0
; Libération du corps si le visuel n'émet jamais death_finished (s)
death_free_fallback=2.0
; Projectiles ennemis : taille du pool, durée de vie (s)
projectile_pool_size=24
projectile_lifetime=2.5
; Largeur de la barre de vie (px)
health_bar_width=56.0
; --- Discrétion : jauge de reconnaissance (awareness 0..1) ---
; Palier de suspicion (s'arrête, se tourne, « ? », enquête)
suspicion_threshold=0.3
; Vue : multiplicateur du gain au bord du rayon de détection / tout près (courbe (1-d/r)^2 entre les deux)
sight_edge_mult=0.1
sight_near_mult=2.0
; Vue : joueur immobile = gain x ce facteur (interpolé jusqu'à 1 à pleine vitesse)
sight_still_mult=0.45
; Vitesse de référence du joueur (px/s) s'il n'expose pas move_speed
player_speed_default=250.0
; Ouïe : atténuation à travers les murs (pas de ligne de vue), bruit ignoré en dessous de ce seuil
hearing_wall_factor=0.4
hearing_noise_floor=0.05
; Ouïe : un saut de bruit >= shot_noise_jump (tir) ajoute un sursaut immédiat
; shot_awareness_bump x (1 - d/hearing_radius) x (shot_wall_factor sans ligne de vue)
shot_noise_jump=0.5
shot_awareness_bump=0.9
shot_wall_factor=0.7
; Repli si le joueur n'a pas get_noise_level() : bruit de marche, décroissance du bruit de tir (s)
fallback_walk_noise=0.35
fallback_shot_noise_decay=0.6
; Voisin prévenu : hausse de jauge (pas un 1 instantané, sauf s'il voit le joueur)
neighbor_awareness_boost=0.6
; Jauge conservée quand la poursuite abandonne (re-repérage plus rapide)
lost_awareness=0.6
; Enquête : pause de suspicion (s), vitesse (fraction), abandon de la marche (s), regard autour (s), changement de regard (s), durée max (s)
suspicion_pause=0.7
investigate_speed_ratio=0.55
investigate_walk_timeout=6.0
investigate_look_time=2.4
investigate_look_turn=0.6
investigate_timeout=12.0
; Joueur vu en train de se cacher : distance max (px), mémoire (s), fouille de la cachette (s)
hide_reveal_distance=220.0
hide_seen_memory=0.6
hide_search_time=0.6
; Sommeil des ennemis loin du joueur (px ; ~1,5 écran) : endormi au-delà de sleep_distance, réveillé sous wake_distance, vérif (s)
sleep_distance=1800.0
wake_distance=1600.0
sleep_check_interval=0.5
; Navigation : recalcul de chemin au plus toutes les (s), revérification de la carte (s)
nav_repath_interval=0.25
nav_check_interval=1.0

[raid]
; Difficulté par défaut du raid (0 = Facile … 4 = Cauchemar) tant que le hub n'existe pas
default_difficulty=1
; Délai (s) avant rechargement du raid (même seed) après la mort du joueur
reload_delay=2.0
; Rayon d'agent (px) pour cuire la navigation (marge autour des murs)
nav_agent_radius=20.0
; Durée (s) de chaque moitié du fondu au noir lors d'un changement d'étage
fade_duration=0.3
; Délai (s) pendant lequel les escaliers sont inactifs après un changement d'étage
stairs_cooldown=0.8
; Temps (s) sur une case d'extraction avant d'afficher le message
extraction_hint_delay=0.5
; Durée (s) d'affichage des messages temporaires
toast_duration=2.0
; Décalage vertical (px) de l'overlay debug F3 (sous le bandeau monde/étage)
debug_overlay_offset=90.0
; Portes du constructeur de secours : marge (px) de la zone de contact qui ouvre la porte
fallback_door_trigger_margin=14.0

[fog]
; --- Logique ---
; Rayon de vue du joueur (cases)
view_radius=10
; Depuis la rue, on ne voit l'intérieur d'un bâtiment (porte ouverte) que jusqu'à cette distance (cases)
outdoor_interior_peek=4
; Durée du fondu d'apparition des ennemis / conteneurs qui entrent dans le champ de vision (s)
transition_time=0.15
; Intervalle (s) entre deux mises à jour des nœuds fog_hideable (ennemis, conteneurs)
hide_interval=0.08
; Le debug F3 révèle toute la carte (false : le F3 ne touche pas au brouillard)
debug_reveal_with_f3=false
; Polygone de visibilité : recalcul si le joueur a bougé de plus de N px, au plus N fois/s
move_threshold_px=4.0
max_updates_per_sec=30.0
; Rayons « cercle » en plus des rayons vers les coins de murs
circle_rays=40
; --- Masque (SubViewport basse résolution, rafraîchi seulement après un recalcul) ---
; Taille d'un texel du masque en px monde (8 = 1/8 de la résolution monde)
mask_px_per_texel=8.0
; Largeur du flou du bord du champ de vision (px monde)
edge_feather_px=22.0
; Les toits des bâtiments dont un mur est en vue sont dégagés de la brume (vus depuis la rue)
reveal_roofs=true
; --- Rendu ---
; Couleur de fond de la brume (bleu nuit) et couleur des volutes
fog_color=Color(0.035, 0.05, 0.11, 1.0)
mist_color=Color(0.2, 0.25, 0.42, 1.0)
; Teinte de la pénombre au bord du champ de vision
penumbra_color=Color(0.06, 0.08, 0.2, 1.0)
; Opacité de la brume sur une zone jamais vue (0..1)
unseen_alpha=0.985
; Souvenir des zones explorées hors vue : l'opacité baisse de cette valeur (0 = aucun souvenir)
explored_memory_strength=0.08
; Densité des volutes (0..1), taille d'une volute (px monde), vitesse de dérive (px/s)
mist_density=0.55
mist_scale=900.0
mist_speed=14.0
; Douceur du bord visible / brouillard (0.01 net .. 0.5 très doux) et déformation par la brume
edge_softness=0.22
edge_noise=0.35
; Vignettage : début de la pénombre en fraction du rayon de vue
vignette_start=0.55
; Brume résiduelle sur la zone visible, croissante vers le bord (0 = nette)
visible_haze=0.12

[generator]
; Générateur de villes Far West (scripts/dungeon/dungeon_generator.gd)
; Nombre de bâtiments du rez-de-chaussée (saloon, banque, shérif, mine toujours présents)
buildings_min=6
buildings_max=8
; Rue principale (largeur en cases) et longueur des tronçons d'entrée/sortie
street_width_min=5
street_width_max=7
street_end_length=9
; Marges ouest/est avant la première maison, largeur minimale de la ville
town_margin_west=6
town_margin_east=7
town_width_min=60
town_height_min=40
; Espace (cases) entre deux bâtiments voisins
building_gap_min=0
building_gap_max=2
; Ruelles entre bâtiments (menant à une arrière-cour) et placette ouverte sur la rue
alleys_min=1
alleys_max=3
alley_width_min=3
alley_width_max=4
plaza_depth_min=4
plaza_depth_max=6
notch_chance=0.6
notch_width_min=7
notch_width_max=10
notch_depth_min=3
notch_depth_max=5
; Probabilité d'un second point d'extraction (arrière-cour à l'est)
second_extraction_chance=0.5
; Gabarits [largeur min, largeur max, hauteur min, hauteur max], murs compris
size_saloon=[12, 16, 11, 14]
size_bank=[11, 15, 10, 13]
size_sheriff=[11, 14, 9, 12]
size_store=[9, 13, 9, 11]
size_hotel=[13, 17, 13, 15]
size_stable=[12, 16, 10, 13]
size_church=[9, 12, 12, 15]
size_mine=[8, 11, 7, 9]
sheriff_armory_chance=0.35
church_rest_chance=0.5
upper_suite_chance=0.4
; Au plus N salles super_loot verrouillées par étage
super_loot_max_per_floor=2
; Types des salles intérieures sans type imposé (poids)
room_type_weights={"combat": 4.0, "loot": 3.0, "trap": 1.5, "rest": 1.0}
; Sous-sol (mine)
mine_attempts=12
mine_rooms_min=6
mine_rooms_max=9
mine_room_w_min=6
mine_room_w_max=11
mine_room_h_min=5
mine_room_h_max=8
mine_tunnel_w_min=2
mine_tunnel_w_max=3
mine_loops_min=1
mine_loops_max=2
mine_sealed_chance=0.7
mine_boss_chance=0.5
mine_extraction_chance=0.5
; Ennemis : densité (ennemis par case de salle) indexée par difficulté 0..4 (Facile → Cauchemar)
enemy_density=[0.020, 0.028, 0.036, 0.046, 0.058]
enemy_room_mult={"combat": 1.3, "corridor": 0.6, "loot": 0.8, "trap": 1.0, "rest": 0.2, "extraction": 0.6, "super_loot": 1.0, "boss": 1.0}
enemy_floor_mult={"-1": 1.3, "0": 1.0, "1": 1.15}
enemy_max_per_room=9
; Gardes des salles super_loot / boss : minimum + bonus par difficulté
guards_min=2
guards_bonus=[0, 0, 1, 1, 2]
; Aucun ennemi à moins de N cases (Manhattan) du point d'apparition du joueur
spawn_safe_radius=9
; Conteneurs : densité par case, multiplicateur par type de salle, plafond
container_density=0.03
container_room_mult={"loot": 2.0, "super_loot": 1.5, "combat": 0.7, "trap": 1.0, "rest": 0.6, "corridor": 0.3}
container_max_per_room=5
super_loot_chests=2

[world_builder]
; Hauteur (px monde) de la face avant visible des murs (vue 3/4)
wall_height=52.0
; Taille (en cases) des blocs de sol / murs dessinés d'un seul tenant
chunk_cells=16
; Toits : opacité quand le joueur est dans le bâtiment, durée du fondu (s)
roof_hidden_alpha=0.1
roof_fade_duration=0.25
; Escaliers ignorés pendant ce délai (s) après la construction de l'étage
stairs_cooldown=0.5
; Vitesse de pulsation de la lueur d'extraction
extraction_pulse_speed=2.2

[door]
; Marge (px) de la zone de contact autour de la case de porte
trigger_margin=14.0
; Durée (s) de l'animation d'ouverture
open_duration=0.22
; Intervalle (s) de revérification des ennemis présents dans la zone (passage en poursuite)
enemy_check_interval=0.2
; Durée (s) du message « Clef requise »
locked_message_duration=1.4

[loot]
; Butin, inventaire de raid, conteneurs, cachettes, interaction (scripts/loot/*)
; Multiplicateurs de poids par rareté (index 0 Commun … 4 Légendaire) :
;   × (1 + rarity_difficulty_bonus[r] × difficulté) × (1 + rarity_floor_bonus[r] × |étage|)
rarity_difficulty_bonus=[0.0, 0.05, 0.15, 0.3, 0.45]
rarity_floor_bonus=[0.0, 0.05, 0.2, 0.35, 0.5]
; Salle super_loot : multiplicateur par rareté (Épique/Légendaire très augmentés) + tirages en plus
super_loot_rarity_mult=[0.3, 0.7, 2.0, 6.0, 10.0]
super_loot_extra_rolls=1
; Durée de fouille par défaut (s) si la table n'en donne pas
search_time=1.2
; Distance (px) de déplacement qui interrompt une fouille
search_move_tolerance=10.0
; Portée d'interaction (px) et intervalle (s) de recherche de la cible la plus proche
interact_range=78.0
interact_check_interval=0.12
; Lueur d'un conteneur ouvert non vidé, selon la meilleure rareté restante (0 = aucune)
glow_min_rarity=2
; Inventaire de raid : grille (colonnes × lignes) et poids maximal (kg)
inventory_columns=6
inventory_rows=4
inventory_max_weight=30.0
; Vitesse du jeu quand l'inventaire est ouvert (0 = pause complète)
inventory_time_scale=0.0
; Cachettes : nombre par étage [min, max] selon le nombre de salles, tremblement (px), période (s)
hiding_spots_min=3
hiding_spots_max=7
hiding_spots_per_room=0.25
hiding_shake_px=1.6
hiding_shake_period=0.09
; Masquer complètement le sprite du joueur caché (sinon : semi-transparence de [player] hidden_alpha)
hide_player_sprite=true
; Clefs spéciales : chance de drop sur un ennemi (0,5 % à 2 %), indexée par difficulté 0..4
key_drop_chance=[0.005, 0.008, 0.011, 0.015, 0.02]
; Chance qu'un ennemi tué laisse une sacoche (table enemy) ; temps de fouille d'une sacoche (s)
enemy_drop_chance=0.25
drop_search_time=0.4
