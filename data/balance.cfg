; exponentielle (accel_sharpness, 1/s) : réactif au départ, arrêt net sans glisse.
acceleration=2400.0
deceleration=3200.0
accel_sharpness=18.0
; Multiplicateur d'accélération quand on change de sens (contre-braquage)
