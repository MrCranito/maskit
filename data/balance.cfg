[affixes]
; Affixes d'armes tirés au hasard à chaque drop en raid (phase 8, scripts/combat/affixes.gd).
; Les valeurs de chaque affixe (dégâts, durée, rayon, poids, catégories) sont dans data/affixes/*.tres.
enabled=true
; Nombre d'affixes par rareté du modèle : Commun, Peu commun (plus utilisé par les armes), Rare,
; Épique, Légendaire. Tirage uniforme entre count_min et count_max, jamais deux fois le même.
count_min=[0, 0, 1, 1, 2]
count_max=[0, 0, 1, 2, 2]
; Valeur marchande (vente au marchand, valeur du butin) × (1 + value_bonus_per_affix × nombre d'affixes)
