; Valeurs d'équilibrage. Aucune de ces valeurs ne doit être écrite en dur dans le code.
; Lire via l'autoload Balance : Balance.get_value("section", "cle", defaut)

[player]
max_hp=100.0
move_speed=250.0
; Déplacement : accélération / décélération linéaires minimales (px/s²) + approche
; exponentielle (accel_sharpness, 1/s) : réactif au départ, arrêt net sans glisse.
acceleration=2400.0
deceleration=3200.0
accel_sharpness=18.0
; Multiplicateur d'accélération quand on change de sens (contre-braquage)
turn_boost=1.8
; Ancienne friction (remplacée par deceleration), gardée pour compatibilité
friction=3200.0
; OBSOLÈTE : plus de tir automatique (double stick). Gardé pour les anciens tests.
auto_fire_only_when_still=false
; Invulnérabilité (s) après un coup reçu, durée du flash blanc (s)
invulnerability_duration=0.6
hit_flash_duration=0.12
; OBSOLÈTE (ancien ciblage automatique)
retarget_interval=0.1
; Bruit (0..1) : marche à pleine vitesse ; durée (s) de décroissance du bruit de tir (1 → 0)
noise_walk=0.35
noise_fire_decay=0.6
; Cachette : on ressort en poussant le stick gauche au-delà de ce seuil, après ce délai (s)
hide_exit_threshold=0.5
hide_exit_grace=0.3
; Opacité du héros caché
hidden_alpha=0.35
; Aide à la visée au stick (mobile) : demi-angle du cône (°), 0 = désactivée
aim_assist_deg=12.0
; Dispersion des tirs (WeaponData.spread_bloom_* / spread_move_deg, WeaponLoadout) : multiplicateurs
; globaux du « bloom » (rafale) et de l'imprécision en mouvement, délai (s) après le dernier tir
; avant que la dispersion redescende, cône affiché = imprécision × mult (plafonné, °)
spread_bloom_mult=1.0
spread_move_mult=1.0
spread_recovery_delay=0.08
spread_cone_visual_mult=1.6
spread_cone_visual_max=28.0

[player_visual]
; Repli SVG : rebond (px), inclinaison (°), écrasement à l'appui, longueur de foulée (px)
bounce_px=3.0
tilt_deg=5.0
squash=0.06
stride_px=34.0
; Hystérésis (°) du choix de direction 8 voies (anti-scintillement)
dir_hysteresis_deg=7.0
; Main (pivot de l'arme) : hauteur au-dessus des pieds et écart latéral (px monde)
hand_height=22.6
hand_radius=10.0
; Tenue de l'arme : vitesse (1/s) à laquelle l'arme rejoint la visée / le sens de marche (sans
; visée), zone morte du retournement gauche/droite (composante x), passage derrière le corps
; quand on vise vers le haut (entrée / sortie, composante y)
weapon_turn_speed_aim=30.0
weapon_turn_speed_move=12.0
weapon_flip_deadzone=0.18
weapon_behind_enter=-0.42
weapon_behind_exit=-0.26
; Recul de l'arme (px, s) et durée de l'éclair de bouche (s)
recoil_px=5.0
recoil_time=0.09
muzzle_flash_time=0.05
; Poussière de pas (CPUParticles2D) : activée, nombre de particules
dust_enabled=true
dust_amount=8

[camera]
smoothing_speed=7.0
; Zoom paysage (1280x720) : champ de vision ≈ 985 x 555 px monde (héros et ennemis plus lisibles sur téléphone)
zoom=1.3
; Anticipation dans la direction de visée (px monde) et vitesse de rattrapage (1/s)
lookahead=110.0
lookahead_speed=4.0
; Légère secousse au tir
shake_on_fire=true
shake_amount=2.5
shake_duration=0.09
; Caméra bornée aux limites de l'étage (Raid.apply_camera_limits) : marge autorisée au-delà du
; bord de la carte (px monde ; 0 = jamais de bande hors carte à l'écran)
edge_margin=0.0

[hud]
; Paysage 1280x720 : marge des panneaux (px), largeur des 10 crans de vie (px), taille du chiffre de PV
margin=16
hp_bar_width=210
hp_font_size=28
; Bandeau monde/salle (haut centre) : marge haute (px)
banner_top=12
; Overlay debug F3 : position (px) sous la barre de vie, taille de police
debug_overlay_top=96
debug_overlay_font_size=15
; Zone sûre (scripts/ui/hud_safe_area.gd) : marge minimale (px viewport) et marge ajoutée à un
; encart réel (encoche, coins arrondis, barre d'accueil)
safe_min_margin=16.0
safe_extra_margin=6.0
; Écart (px) entre le bouton pause et le bouton sac (haut droite)
pause_bag_gap=10.0
; HUD compact (scripts/ui/weapon_hud.gd) : centres relatifs à la position de repos du stick de
; visée (px viewport) : pastille de l'arme tenue, ronds des 2 autres armes, équipement, Recharger
cluster_pill=Vector2(-205, 10)
cluster_other_1=Vector2(-132, 82)
cluster_other_2=Vector2(-62, 122)
cluster_gadget=Vector2(-150, -66)
cluster_reload=Vector2(100, -118)
; Bouton action (Fouiller, Ouvrir…) relevé au-dessus du stick de visée (px) pour laisser Recharger
action_button_lift=40.0
; Bouton Recharger allumé quand munitions <= cette part du chargeur
reload_alert_ratio=0.3
; Emplacements rapides : centre du 1er relatif au repos du stick de déplacement, puis pas entre deux
quick_first=Vector2(-20, -150)
quick_step=Vector2(78, 14)

[weapon_default]
; Arme de départ : revolver (data/weapons/starter_revolver.tres)
damage=14.0
fire_rate=3.0
projectile_speed=980.0
range=620.0
projectile_lifetime=0.65
projectile_count=1
spread_degrees=0.0
pierce=0

[projectile_pool]
; Projectiles pré-instanciés par pool (le pool s'agrandit si épuisé)
size=64

[target_dummy]
max_hp=60.0
respawn_delay=2.0

[joystick]
; Rayon de la base (px écran, viewport 1280x720)
radius=90.0
; Zone morte du stick gauche (déplacement) et du stick droit (visée : en deçà, pas de tir)
dead_zone=0.15
aim_dead_zone=0.3
; Affiche les joysticks même sans écran tactile (test sur PC)
force_on_desktop=false
; Aucun stick ne s'active au-dessus de cette fraction de la hauteur d'écran (HUD)
activation_top_ratio=0.25
; Position de repos (fraction de l'écran) des bases fantômes gauche / droite
left_rest_x=0.13
right_rest_x=0.87
rest_y=0.77
show_rest_ghost=true
; La base suit le doigt s'il dépasse le rayon
follow_finger=true


[test_room]
; Dimensions de la salle de test (px)
width=1400.0
height=2000.0
wall_thickness=64.0
tile_size=80.0
; Délai (s) avant rechargement de la salle après la mort du joueur
reload_delay=2.0
; Rayon d'agent (px) pour cuire la navigation (marge autour des piliers)
nav_agent_radius=30.0

[debug]
; Intervalle de rafraîchissement du texte de l'overlay F3 (s)
overlay_refresh_interval=0.2

[dev]
; Mode développeur (DevMode) : gemmes et or illimités (achats gratuits, solde affiché « ∞ »).
; N'existe QUE dans un build debug ou l'éditeur (jamais en version publiée). Basculable au F3
; (panneau « Mode développeur ») ou F4 quand le F3 est ouvert. Ne modifie pas le solde sauvegardé.
unlimited_currency=false

[enemy_ai]
; Intervalle (s) entre deux tests de perception (zone + cône + raycast de ligne de vue)
los_check_interval=0.1
; En combat, portée de vue = detection_radius x ce facteur (cône ignoré)
chase_sight_multiplier=1.5
; Distance (px) considérée comme « arrivé »
arrive_distance=12.0
; Évitement des murs en steering direct : longueur (px, en plus du rayon) et angle des moustaches
whisker_length=48.0
whisker_angle_deg=35.0
; NavigationAgent2D : recalcul du chemin si la cible a bougé de plus de (px)
nav_repath_distance=24.0
; Patrouille : vitesse (fraction de move_speed), pauses aléatoires (s), abandon d'une destination (s)
patrol_speed_ratio=0.4
patrol_pause_min=0.8
patrol_pause_max=2.2
patrol_walk_timeout=3.0
; Poursuite : mémoire de la position réelle juste après perte de vue (s), recherche max (s), laisse (px)
track_memory=0.5
search_timeout=4.0
leash_distance=900.0
; L'archer recule à cette fraction de sa vitesse
retreat_speed_ratio=0.8
; Attaque : récupération après le coup (s), tolérance de portée mêlée au moment de l'impact (px)
attack_recovery=0.18
melee_hit_tolerance=16.0
; Retour : vitesse (fraction), régénération (fraction des PV max par seconde), abandon (s)
return_speed_ratio=0.7
return_regen_ratio_per_sec=0.25
return_timeout=8.0
; Libération du corps si le visuel n'émet jamais death_finished (s)
death_free_fallback=2.0
; Projectiles ennemis : taille du pool, durée de vie (s)
projectile_pool_size=24
projectile_lifetime=2.5
; Largeur de la barre de vie (px) : discrète, visible seulement en combat ou blessé
health_bar_width=40.0
; --- Discrétion : jauge de reconnaissance (awareness 0..1) ---
; Palier de suspicion (s'arrête, se tourne, « ? », enquête)
suspicion_threshold=0.3
; Vue : multiplicateur du gain au bord du rayon de détection / tout près (courbe (1-d/r)^2 entre les deux)
sight_edge_mult=0.1
sight_near_mult=2.0
; Vue : joueur immobile = gain x ce facteur (interpolé jusqu'à 1 à pleine vitesse)
sight_still_mult=0.45
; Vitesse de référence du joueur (px/s) s'il n'expose pas move_speed
player_speed_default=250.0
; Ouïe : atténuation à travers les murs (pas de ligne de vue), bruit ignoré en dessous de ce seuil
hearing_wall_factor=0.4
hearing_noise_floor=0.05
; Ouïe : un saut de bruit >= shot_noise_jump (tir) ajoute un sursaut immédiat
; shot_awareness_bump x (1 - d/hearing_radius) x (shot_wall_factor sans ligne de vue)
shot_noise_jump=0.5
shot_awareness_bump=0.9
shot_wall_factor=0.7
; Repli si le joueur n'a pas get_noise_level() : bruit de marche, décroissance du bruit de tir (s)
fallback_walk_noise=0.35
fallback_shot_noise_decay=0.6
; Voisin prévenu : hausse de jauge (pas un 1 instantané, sauf s'il voit le joueur)
neighbor_awareness_boost=0.7
; Jauge conservée quand la poursuite abandonne (re-repérage plus rapide)
lost_awareness=0.6
; Enquête : pause de suspicion (s), vitesse (fraction), abandon de la marche (s), regard autour (s), changement de regard (s), durée max (s)
suspicion_pause=0.7
investigate_speed_ratio=0.55
investigate_walk_timeout=6.0
investigate_look_time=2.4
investigate_look_turn=0.6
investigate_timeout=12.0
; Joueur vu en train de se cacher : distance max (px), mémoire (s), fouille de la cachette (s)
hide_reveal_distance=220.0
hide_seen_memory=0.6
hide_search_time=0.6
; Sommeil des ennemis loin du joueur (px ; ~1,5 écran) : endormi au-delà de sleep_distance, réveillé sous wake_distance, vérif (s)
sleep_distance=1800.0
wake_distance=1600.0
sleep_check_interval=0.5
; Navigation : recalcul de chemin au plus toutes les (s), revérification de la carte (s)
nav_repath_interval=0.25
nav_check_interval=1.0
; (Refonte ennemis) La recherche du joueur perdu, le repli, l'étourdissement et les schémas
; d'attaque sont réglés dans [enemy_tactics] ; la difficulté dans [enemy_difficulty].

[raid]
; Difficulté par défaut du raid (0 = Facile … 4 = Cauchemar) tant que le hub n'existe pas
default_difficulty=1
; Délai (s) avant rechargement du raid (même seed) après la mort du joueur
reload_delay=2.0
; Rayon d'agent (px) pour cuire la navigation (marge autour des murs)
nav_agent_radius=20.0
; Durée (s) de chaque moitié du fondu au noir lors d'un changement d'étage
fade_duration=0.3
; Délai (s) pendant lequel les escaliers sont inactifs après un changement d'étage
stairs_cooldown=0.8
; Temps (s) sur une case d'extraction avant d'afficher le message
extraction_hint_delay=0.5
; Durée (s) d'affichage des messages temporaires
toast_duration=2.0
; Décalage vertical (px) de l'overlay debug F3 (sous le bandeau monde/étage)
debug_overlay_offset=90.0
; Portes du constructeur de secours : marge (px) de la zone de contact qui ouvre la porte
fallback_door_trigger_margin=14.0
; Délai (s) entre la mort du joueur et l'écran de fin de raid (Exfil Rush)
death_screen_delay=2.0

[fog]
; --- Logique ---
; Rayon de vue du joueur (cases)
view_radius=10
; Depuis la rue, on ne voit l'intérieur d'un bâtiment (porte ouverte) que jusqu'à cette distance (cases)
outdoor_interior_peek=4
; Durée du fondu d'apparition des ennemis / conteneurs qui entrent dans le champ de vision (s)
transition_time=0.15
; Intervalle (s) entre deux mises à jour des nœuds fog_hideable (ennemis, conteneurs)
hide_interval=0.08
; Le debug F3 révèle toute la carte (false : le F3 ne touche pas au brouillard)
debug_reveal_with_f3=false
; Polygone de visibilité : recalcul si le joueur a bougé de plus de N px, au plus N fois/s
move_threshold_px=4.0
max_updates_per_sec=30.0
; Rayons « cercle » en plus des rayons vers les coins de murs
circle_rays=40
; --- Masque (SubViewport basse résolution, rafraîchi seulement après un recalcul) ---
; Taille d'un texel du masque en px monde (8 = 1/8 de la résolution monde)
mask_px_per_texel=8.0
; Largeur du flou du bord du champ de vision (px monde)
edge_feather_px=22.0
; Les toits des bâtiments dont un mur est en vue sont dégagés de la brume (vus depuis la rue)
reveal_roofs=true
; --- Rendu ---
; Style du brouillard hors du champ de vision (réglages dans la section [fog_<style>]) :
;   "darkened" = option A « décor assombri » : décor encore lisible, désaturé, assombri, teinté bleu nuit
;   "mist"     = option B « brume stylisée » : brume bleu nuit → violet, dégradé depuis le bord, grain fin
;   "natural"  = décor nuit lisible, bord large et irrégulier, pénombre au-delà du bord, lumière
;                qui faiblit avec la distance (retour de Victor : A et B « pas naturels », bords nets)
; Dans tous les styles, ennemis et conteneurs hors vue restent cachés (groupe fog_hideable).
fog_style="natural"

[fog_darkened]
; Option A « décor assombri » (assets/shaders/fog_darkened.gdshader, 5 lectures de texture).
; Halo large du masque (px monde, canal G) : 0 = inutilisé par ce style
halo_px=0.0
; Teinte multiplicative du décor hors vue (bleu nuit) et plancher de couleur (jamais de noir pur)
shade_tint=Color(0.55, 0.66, 1.0, 1.0)
shade_floor=Color(0.025, 0.035, 0.075, 1.0)
; Zones explorées hors vue : luminosité (0..1) et saturation (0..1) restantes du décor
explored_brightness=0.42
explored_saturation=0.3
; Zones jamais vues : luminosité et saturation restantes (quasi illisible ; l'ancien souvenir laissait ~9 %)
unseen_brightness=0.06
unseen_saturation=0.0
; Brume légère animée par-dessus : couleur, densité (0..1), taille d'une volute (px monde), dérive (px/s)
mist_color=Color(0.22, 0.27, 0.48, 1.0)
mist_density=0.22
mist_scale=900.0
mist_speed=14.0
; Bord du champ de vision : douceur (0.01 net .. 0.5 très doux), déformation par la brume
edge_softness=0.14
edge_noise=0.18
; Vignettage : début de l'estompe en fraction du rayon de vue, irrégularité
vignette_start=0.72
vignette_noise=0.08
; Pénombre (fine bande bleu nuit au bord de vision) : couleur, force (0..1)
penumbra_color=Color(0.1, 0.13, 0.3, 1.0)
penumbra_strength=0.35
; Brume résiduelle sur la zone visible, croissante vers le bord (0 = nette)
visible_haze=0.06

[fog_natural]
; Brouillard « naturel » (assets/shaders/fog_natural.gdshader, 5 lectures de texture).
; Flou du bord du champ de vision (px monde, remplace [fog] edge_feather_px) et pénombre :
; longueur du dégradé de lumière au-delà du bord (halo du masque, px monde)
edge_feather_px=64.0
halo_px=210.0
; Bord : douceur (0.01 net .. 0.5 très doux), déformation par la brume (bord irrégulier)
edge_softness=0.34
edge_noise=0.35
; Lumière qui faiblit avec la distance : début de l'estompe (fraction du rayon de vue), irrégularité
vignette_start=0.45
vignette_noise=0.12
; Décor hors vue : teinte nuit, plancher, luminosité et saturation (explorées / jamais vues)
shade_tint=Color(0.7, 0.76, 1.0, 1.0)
shade_floor=Color(0.03, 0.035, 0.06, 1.0)
explored_brightness=0.5
explored_saturation=0.42
unseen_brightness=0.14
unseen_saturation=0.15
; Pénombre : lumière gardée juste au-delà du bord (0..1) et courbe de décroissance
penumbra_light=0.55
penumbra_curve=1.6
; Brume légère (plus présente loin du joueur) : couleur, densité, taille, dérive
mist_color=Color(0.2, 0.24, 0.38, 1.0)
mist_density=0.16
mist_scale=900.0
mist_speed=14.0
; Lumière chaude qui faiblit près du bord de vision
dusk_color=Color(1.0, 0.86, 0.72, 1.0)
dusk_strength=0.18

[fog_mist]
; Option B « brume stylisée » (assets/shaders/fog_mist.gdshader, 4 lectures de texture).
; Halo large du masque (px monde, canal G) : longueur du dégradé depuis le bord de vision
halo_px=170.0
; Brume profonde (loin du bord), brume claire (près du bord), accent violet électrique (#7C4DFF) et sa force
deep_color=Color(0.09, 0.1, 0.22, 1.0)
light_color=Color(0.23, 0.24, 0.46, 1.0)
accent_color=Color(0.486, 0.302, 1.0, 1.0)
accent_strength=0.12
; Opacité de la brume : jamais vu (≥ 0.905, l'ancien souvenir), exploré, baisse au plus près du bord
unseen_alpha=0.95
explored_alpha=0.8
halo_alpha_drop=0.05
; Volutes : densité (0..1), taille (px monde), dérive (px/s)
mist_density=0.5
mist_scale=900.0
mist_speed=14.0
; Grain fin : amplitude (0..0.2) et images/s
grain_strength=0.035
grain_fps=24.0
; Bord du champ de vision : douceur, déformation par la brume
edge_softness=0.2
edge_noise=0.3
; Vignettage : début de l'estompe en fraction du rayon de vue, irrégularité
vignette_start=0.62
vignette_noise=0.12
; Brume résiduelle sur la zone visible, croissante vers le bord (0 = nette)
visible_haze=0.08

