; Valeurs d'équilibrage. Aucune de ces valeurs ne doit être écrite en dur dans le code.
; Lire via l'autoload Balance : Balance.get_value("section", "cle", defaut)

[player]
max_hp=100.0
move_speed=260.0
acceleration=2200.0
friction=2600.0
; Le joueur tire automatiquement seulement quand il est immobile (comme Archero)
auto_fire_only_when_still=true
; Invulnérabilité (s) après un coup reçu, durée du flash blanc (s)
invulnerability_duration=0.6
hit_flash_duration=0.12
; Intervalle (s) entre deux recherches de la cible la plus proche
retarget_interval=0.1

[camera]
smoothing_speed=8.0
zoom=1.3

[weapon_default]
damage=10.0
fire_rate=2.5
projectile_speed=700.0
range=520.0
projectile_lifetime=1.2
projectile_count=1
spread_degrees=0.0
pierce=0

[projectile_pool]
; Projectiles pré-instanciés par pool (le pool s'agrandit si épuisé)
size=64

[target_dummy]
max_hp=60.0
respawn_delay=2.0

[joystick]
radius=110.0
dead_zone=0.15
; Affiche le joystick même sans écran tactile (test sur PC)
force_on_desktop=false
; Le joystick ne s'active que sous cette fraction de la hauteur d'écran
activation_top_ratio=0.5


[test_room]
; Dimensions de la salle de test (px)
width=1400.0
height=2000.0
wall_thickness=64.0
tile_size=80.0

[debug]
; Intervalle de rafraîchissement du texte de l'overlay F3 (s)
overlay_refresh_interval=0.2
