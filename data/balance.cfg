[raider]
; Niveau de raider (scripts/progression/raider_progress.gd) : progression PERMANENTE, distincte du
; pass de combat. XP d'une fin de raid = XP du pass de ce raid × xp_ratio. XP pour passer du niveau N
; au suivant = xp_base + xp_step × (N - 1) ; niveau maximal.
xp_ratio=1.0
xp_base=400
xp_step=150
max_level=30
