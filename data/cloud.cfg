; Sauvegarde cloud et comptes (Supabase). Lu par l'autoload CloudSync (scripts/net/cloud_sync.gd).
; La clef « publishable » est publique par conception : elle n'ouvre que ce que les règles
; d'accès (RLS) autorisent, c'est-à-dire la propre ligne du joueur connecté.
[supabase]
url="https://ybtbbshplmjbebuaxrgy.supabase.co"
publishable_key="sb_publishable_50RGsjdgpgX4zDRqkYKK1Q_H95YFC6s"
; false = pas de cloud du tout (jeu 100 % local, utile pour les tests)
enabled=true

[sync]
; Délai (s) entre la dernière sauvegarde locale et l'envoi au cloud (regroupe les écritures)
push_delay=2.0
; Délai (s) avant une nouvelle tentative après un échec réseau
retry_delay=20.0
; Délai (s) max d'une requête HTTP
timeout=15.0
; Marge (s) avant l'expiration du jeton pour le renouveler
token_margin=120.0
; Taille max (octets) d'une sauvegarde envoyée (le serveur refuse au-delà de 1 Mo)
max_bytes=900000
