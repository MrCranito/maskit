    <radialGradient id="fond" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2a3a6e"/>
      <stop offset="1" stop-color="#0f1630"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#fond)" stroke="#0a0f22" stroke-width="4"/>
  <!-- Contour du masque -->
  <path d="M64 18 C90 18 104 32 104 56 C104 84 86 106 64 112 C42 106 24 84 24 56 C24 32 38 18 64 18 Z"
        fill="#f4efe6" stroke="#1b1b26" stroke-width="5" stroke-linejoin="round"/>
