  <path d="M64 18 C90 18 104 32 104 56 C104 84 86 106 64 112 Z" fill="#d9d1c4" opacity="0.55"/>
  <!-- Marques rouges -->
  <path d="M64 24 L58 40 L64 46 L70 40 Z" fill="#c8202f"/>
  <path d="M34 72 C40 76 46 82 48 92" fill="none" stroke="#c8202f" stroke-width="5" stroke-linecap="round"/>
  <path d="M94 72 C88 76 82 82 80 92" fill="none" stroke="#c8202f" stroke-width="5" stroke-linecap="round"/>
  <!-- Yeux -->
  <path d="M36 56 C42 46 54 46 58 58 C50 62 42 62 36 56 Z" fill="#1b1b26"/>
  <path d="M92 56 C86 46 74 46 70 58 C78 62 86 62 92 56 Z" fill="#1b1b26"/>
  <!-- Bouche -->
