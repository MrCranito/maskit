# Fly.io : fly launch --copy-config --no-deploy  puis  fly deploy  (voir README.md)
app = "raidersgo-relay"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  LOG = "1"

[http_service]
  internal_port = 8787
  force_https = true
  # Un seul serveur, toujours allumé : les salons vivent en mémoire.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
